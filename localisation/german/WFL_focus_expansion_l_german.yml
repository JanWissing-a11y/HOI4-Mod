l_german:
 WFL_zusaetzlicher_forschungsrat:0 "Der Forschungsrat von Flüren"
 WFL_zusaetzlicher_forschungsrat_desc:0 "Ein eigener Forschungsrat verbindet Berufskolleg, Werkstätten und unabhängige Tüftler. Dieser Fokus gewährt genau einen zusätzlichen Forschungsplatz, einmalig und zusätzlich zum bestehenden Technikschul-Fokus."
 WFL_atomprogramm_am_auesee:0 "Das Atomprogramm am Auesee"
 WFL_atomprogramm_am_auesee_desc:0 "Unter strengster Geheimhaltung wird am Auesee gerechnet, gemessen und ungewöhnlich viel Kaffee gekocht. Nukleare Technologien erhalten dauerhaft +300 Prozent Forschungsgeschwindigkeit. Drei weitere Forschungsboni von jeweils +300 Prozent bauen vier Jahre Vorlaufstrafe ab. Reaktor-, Atom-, Wasserstoffbomben- und Gefechtskopfprojekte erhalten gezielt +400 Prozent Geschwindigkeit; Nuklearanlagen und beide Forschungsreaktortypen werden +300 Prozent schneller gebaut. Atom- und Wasserstoffbombenproduktion steigen um +200 Prozent. Die normalen Technologie-, Projekt- und Einsatzvoraussetzungen bleiben bestehen."
 WFL_geheimlabor_flueren:0 "Das Geheimlabor Flüren"
 WFL_geheimlabor_flueren_desc:0 "Im eigenen, vollständig kontrollierten Wesel-Flüren entsteht eine Nuklearforschungsanlage in Provinz 3512. Ist der Standort bei Abschluss belegt, entmilitarisiert oder verloren, fließen stattdessen 150 politische Macht in die Neuplanung. Einmalig kommen ein Nuklearwissenschaftler der Stufe 5 und fünf nukleare Durchbruchpunkte hinzu. Der Wissenschaftler muss anschließend einer geeigneten Anlage zugewiesen werden; Projekte werden regulär begonnen."
 WFL_flueren_flugzeugwunder:0 "Das Flürener Flugzeugwunder"
 WFL_flueren_flugzeugwunder_desc:0 "Aus der Werkbank wird eine Luftfahrtlegende: Die IC-Kosten sämtlicher Flugzeugtypen sinken um 66,666667 Prozent auf ein Drittel. Bei gleicher Fabrikleistung und Effizienz entspricht das dreifacher Produktion. Jagd-, Träger-, Unterstützungs-, Marine-, Aufklärungs-, Transport-, Düsen-, Raketenabfang-, Interkontinental- und Mutterschiffflugzeuge sind erfasst. Weitere Kostenrabatte werden nach den üblichen Spielregeln addiert."
 WFL_auesee_atomoffensive:0 "Atomoffensive am Auesee"
 WFL_auesee_atomoffensive_desc:0 "Sehr starke, ausschließlich WFL betreffende Nuklearförderung: +300 Prozent nukleare Technologieforschung, +400 Prozent Geschwindigkeit für die vier genannten Nuklearprojekte, +300 Prozent Anlagen-/Reaktorbau und +200 Prozent Bombenproduktion. Technologie, Wissenschaftler, Durchbrüche und Forschungsprojekte bleiben Teil der regulären Entwicklung."
 WFL_dreifache_flugzeugfertigung:0 "Dreifache Flugzeugfertigung"
 WFL_dreifache_flugzeugfertigung_desc:0 "Alle 20 vorhandenen Flugzeug-Basis- und Rollentypen kosten nur ein Drittel ihrer normalen IC. Ohne weitere Kostenrabatte entstehen bei gleicher Fabrikleistung dreimal so viele Flugzeuge. Andere Kostenmodifikatoren addieren sich; Rohstoffmangel und Produktionseffizienz gelten weiterhin. Fahrzeuge, Schiffe, Raketenmunition und Infanteriewaffen erhalten diesen Rabatt nicht."
 WFL_atomprogramm_forschungsbonus:0 "Flürener Atomforschungsprogramm"
