 STATE_1082:0 "Wesel-Flüren"
 VICTORY_POINTS_3512:0 "Wesel-Flüren"
 WFL_BOOKMARK_NAME:0 "Die Macht am Niederrhein"
 WFL_BOOKMARK_DESC:0 "Am 1. Januar 1936 beginnt die fiktive Unabhängigkeit von Wesel-Flüren. Eine bestehende Kartenprovinz bildet das erweiterte Umland ab."
 WFL_BOOKMARK_HISTORY:0 "Jan Graf von Insel I. führt den unabhängigen Schützenstaat am Rhein. Eine kleine Miliz schützt seine Ordnung. Eine Stärkung der Schützenkrone, der Aufbau einer Schützenverwaltung unter Jan oder die demokratische Bürgerrepublik bestimmen den weiteren Weg."
