 WFL_board_lobby_finn_bielig_desc:0 "Finn beantragt eine strategische Bratwurstreserve. Du organisierst den Grilltransport, aber bei der Frage nach Senf oder Ketchup droht ein diplomatischer Zwischenfall.\n\nMöglicher Beschluss: -10% Nachschubverbrauch und Heeresausbildungszeit.\n\n35 politische Macht; einmal bis zur nächsten Versammlung. 85% Zusage, 10% Zusage und Verärgerung eines zufälligen anderen Vorstandsmitglieds, 5% Verärgerung dieses Mitglieds. Zustimmung mit Zusage 85%, ohne Zusage 35%; verärgert 0%. Zusagen beseitigen keinen bestehenden Streit. Bei mindestens zwei Verärgerten: 20% Blockade (-5 Prozentpunkte Stabilität, -10% politischer Machtgewinn), 10% Eklat (alle positiven Anträge scheitern; -10% Fabrikleistung und Baugeschwindigkeit, -5% Heeresorganisation).\n\n[WFLBoardInfluenceMoodRules] Unter 40/20 Stimmung entstehen -5/-10 Prozentpunkte Stabilität."
