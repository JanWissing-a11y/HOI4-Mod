l_german:
 WFL_vorstand:0 "Vorstand"
 WFL_vorstand_desc:0 "Der Vorstand stimmt alle sechs Monatswechsel über die unten gezeigten Boni ab. Mit Zusage hat ein Antrag 85%, ohne Zusage 35% Zustimmung; verärgert scheitert er. Einflussnahme kostet Stimmung und birgt Streitrisiken. Unter 40 Stimmung sinkt die Stabilität, unter 20 verschärft sich der Abzug. Versöhnungsentscheidungen verbessern die Stimmung. Alle Wahrscheinlichkeiten und Kosten stehen an den jeweiligen Entscheidungen."
 WFL_assembly_blockade_idea:0 "Vorstandsblockade"
 WFL_assembly_blockade_idea_desc:0 "Der Kassenwart bezahlt nichts, bevor das Flaschenpfand geklärt ist. Bis zur nächsten Versammlung: -5 Prozentpunkte Stabilität und -10% politischer Machtgewinn."
 WFL_assembly_eklat_idea:0 "Eklat im Vereinssaal"
 WFL_assembly_eklat_idea_desc:0 "Die Grillkommission ist zurückgetreten, das Protokoll liegt im Kartoffelsalat. Alle positiven Beschlüsse sind gescheitert. Bis zur nächsten Versammlung: -10% Fabrikleistung, -10% allgemeine Baugeschwindigkeit und -5% Heeresorganisation."
 wfl_assembly.1.t:0 "Flürens Bataillon hat getagt"
 wfl_assembly.1.a:0 "Das Protokoll hängt am schwarzen Brett."
 wfl_assembly.1.d:0 "[WFLAssemblyStory]\n\nNils Meyer: [WFLBoardNilsMeyerLastResult]\nJannik Altenschmidt: [WFLBoardJannikAltenschmidtLastResult]\nTobias Gärtner: [WFLBoardTobiasGaertnerLastResult]\nFinn Bielig: [WFLBoardFinnBieligLastResult]\nMax Gerwers: [WFLBoardMaxGerwersLastResult]\nTim Wissing: [WFLBoardTimWissingLastResult]\n\nDie Beschlüsse und Abzüge gelten bis zur nächsten Bataillonsversammlung."
 WFL_assembly_story_1:0 "Nach 30 Minuten Debatte über eine kürzere Tagesordnung beginnt die Sitzung. Zwischen Bierdeckeln und Bauplänen verkündet der Schriftführer die Beschlüsse:"
 WFL_assembly_story_2:0 "Finns Grillzange dient heute als Rednerstab. Wer sie abgibt, bekommt eine Bratwurst. So ordentlich wurde in Flüren lange nicht abgestimmt:"
 WFL_assembly_story_3:0 "Nils überträgt die Sitzung, bis Jannik die Kamera auf die Kasse gerichtet sieht. Nach der technischen Pause stehen diese Beschlüsse im Protokoll:"
 WFL_assembly_story_4:0 "Streit um Flaschenpfand blockiert die Kasse. Tims Versöhnungsrunde bleibt unbezahlt. Neben den Einzelbeschlüssen sinken Stabilität und politischer Machtgewinn:"
 WFL_assembly_story_5:0 "Ein Misstrauensantrag gegen die Grillkommission endet mit dem Rednerhammer im Kartoffelsalat. Alle positiven Anträge scheitern; Produktion, Bau und Heer leiden."
 WFL_board_lobby_nils_meyer:0 "Nils Meyer: Antrag unterstützen"
 WFL_board_lobby_nils_meyer_desc:0 "Nils überredet die Werkmeister mit einer Handy-Präsentation. Die erste Folie zeigt zwar seine letzte Tresenrunde, doch die Produktionskurve auf Folie zwei überzeugt.\n\nMöglicher Beschluss: +15% Fabrik- und Werftleistung.\n\n35 politische Macht; einmal bis zur nächsten Versammlung. 85% Zusage, 10% Zusage und Verärgerung eines zufälligen anderen Vorstandsmitglieds, 5% Verärgerung dieses Mitglieds. Zustimmung mit Zusage 85%, ohne Zusage 35%; verärgert 0%. Zusagen beseitigen keinen bestehenden Streit. Bei mindestens zwei Verärgerten: 20% Blockade (-5 Prozentpunkte Stabilität, -10% politischer Machtgewinn), 10% Eklat (alle positiven Anträge scheitern; -10% Fabrikleistung und Baugeschwindigkeit, -5% Heeresorganisation).\n\n[WFLBoardInfluenceMoodRules] Unter 40/20 Stimmung entstehen -5/-10 Prozentpunkte Stabilität."
 WFL_assembly_nils_meyer_idea:0 "Nils Meyer: Beschlossener Antrag"
 WFL_assembly_nils_meyer_idea_desc:0 "+15% Fabrik- und Werftleistung. Gilt bis zur nächsten Bataillonsversammlung."
 WFL_board_lobby_jannik_altenschmidt:0 "Jannik Altenschmidt: Antrag unterstützen"
 WFL_board_lobby_jannik_altenschmidt_desc:0 "Jannik zeichnet neue Fabriken auf Bierdeckel. Du spendierst einen ganzen Stapel und hoffst, dass niemand den Bauplan als Untersetzer benutzt.\n\nMöglicher Beschluss: +15% Baugeschwindigkeit für Zivil- und Militärfabriken.\n\n35 politische Macht; einmal bis zur nächsten Versammlung. 85% Zusage, 10% Zusage und Verärgerung eines zufälligen anderen Vorstandsmitglieds, 5% Verärgerung dieses Mitglieds. Zustimmung mit Zusage 85%, ohne Zusage 35%; verärgert 0%. Zusagen beseitigen keinen bestehenden Streit. Bei mindestens zwei Verärgerten: 20% Blockade (-5 Prozentpunkte Stabilität, -10% politischer Machtgewinn), 10% Eklat (alle positiven Anträge scheitern; -10% Fabrikleistung und Baugeschwindigkeit, -5% Heeresorganisation).\n\n[WFLBoardInfluenceMoodRules] Unter 40/20 Stimmung entstehen -5/-10 Prozentpunkte Stabilität."
