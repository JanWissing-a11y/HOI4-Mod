 WFL_staff_till_hoehne_name:0 "Till Hoehne"
 WFL_staff_till_hoehne_desc:0 "Till brachte zur ersten Kabinettssitzung einen Stempel, einen Bauplan und genug Durchschläge für den ganzen Niederrhein mit. Seitdem werden Beschlüsse gefasst, bevor die Kaffeekanne leer ist. Nur Anträge auf neue Formulare brauchen noch ein Formular; auf diese Tradition möchte er nicht verzichten."
 WFL_staff_appoint_till_hoehne:0 "Till Hoehne in den Schützenrat"
 WFL_staff_appoint_till_hoehne_desc:0 "Till brachte zur ersten Kabinettssitzung einen Stempel, einen Bauplan und genug Durchschläge für den ganzen Niederrhein mit. Seitdem werden Beschlüsse gefasst, bevor die Kaffeekanne leer ist. Nur Anträge auf neue Formulare brauchen noch ein Formular; auf diese Tradition möchte er nicht verzichten.\n\nAls Ratsmitglied: Kanzler der Bürgerhalle. Nach seiner Ernennung bearbeitet er drei eigene Vorhaben automatisch neben unserem normalen Fokus."
 WFL_staff_till_hoehne_autonomous_tt:0 "Nur Till Hoehne kann diesen Fokus automatisch abschließen. Er muss einen Sonderplatz innehaben. Vorbereitung: 75–120 Tage; Aufträge: 140/140/280 Tage. Restzeit des aktuellen Vorhabens: [?WFL_staff_till_hoehne_days|0] Tage. Dieser Fokus belegt unseren nationalen Fokusplatz nicht."
