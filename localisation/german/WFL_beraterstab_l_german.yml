l_german:
 WFL_beraterstab_gruenden:0 "Der Schützenrat des Grafen"
 WFL_beraterstab_gruenden_desc:0 "Der Graf bestellt fünf fähige Köpfe in die Bürgerhalle. Leider stehen am Ratstisch nur drei bequeme Stühle. Ernannte Ratsmitglieder erhalten eigene Befugnisse und erledigen nacheinander drei Aufgaben parallel zu unserem normalen nationalen Fokus. Der Rat arbeitet ausschließlich unter Jan und dem Schützenwesen."
 WFL_staff_shortcut:0 "Schützenrat"
 WFL_staff_system_tt:0 "Drei zusätzliche Sonderplätze aus fünf Ratsmitgliedern. Ernennungen dauern 14 Tage; danach gilt eine Sperre von 175 Tagen. Jedes Mitglied bearbeitet seine eigenen Folgefokusse automatisch: 75–120 Tage Vorbereitung, dann 140/140/280 Tage Arbeit. Der normale Fokus läuft weiter. Bei Absetzung entfallen die Amtsboni; erreichte Stufen und abgeschlossene Fokusse bleiben erhalten."
 WFL_staff_leadership_tt:0 "Jan Graf von Insel I. regiert das nicht kapitulierte Flüren unter dem Schützenwesen."
 WFL_staff_cooldown_tt:0 "Die Ernennungssperre ist abgelaufen. Noch [?WFL_staff_cooldown|0] Tage."
 WFL_staff_pending_tt:0 "Kein noch unbeantworteter Austausch im Schützenrat."
 WFL_staff_appointment_tt:0 "Das Ratsmitglied erhält einen freien Sonderplatz. Sind alle drei Plätze besetzt, wählen wir im Austauschereignis ein bisheriges Mitglied aus. Seine Amtsboni verschwinden und sein laufender Auftrag wird verworfen. Ein Abbruch gibt den Ernennungsfokus wieder frei. Ein bestehender politischer Beraterplatz wird nicht belegt."
 WFL_staff_upgrade_tt:0 "Automatischer Ratsauftrag: verbessert die Amtsboni um eine Stufe. Die Belohnung gilt einmalig und nur für das weiterhin amtierende Ratsmitglied nach Ablauf seiner Arbeitszeit."
 wfl_staff.1.t:0 "Fünf Bewerber, drei gepolsterte Stühle"
 wfl_staff.1.d:0 "Der Graf eröffnet den Schützenrat in der Bürgerhalle. Dante bringt eine Mannschaftsliste, Neal einen Versorgungsplan und sein berüchtigtes Messglas. Max Heinsch spricht bereits über eine neue Fertigungslinie, Max Müller faltet seine Lagekarten auseinander, und Till hat vorsorglich alle Anwesenheitszettel gestempelt.\n\nErst dann fällt auf, dass am Tisch nur drei gepolsterte Stühle stehen. Der Kassenwart erklärt die beiden übrigen zu strategischen Reserven. Der Graf entscheidet: Drei Ratsmitglieder erhalten gleichzeitig besondere Befugnisse und arbeiten selbständig an ihren Vorhaben. Wer neu dazukommt, muss nötigenfalls einen der Stühle übernehmen."
 wfl_staff.1.a:0 "Die gepolsterten Stühle sind Staatsangelegenheit."
 wfl_staff.2.t:0 "Am Ratstisch wird es eng"
 wfl_staff.2.desc:0 "Ein weiteres Ratsmitglied steht bereit, aber alle drei Sonderplätze sind besetzt. Der Graf lehnt den Vorschlag ab, einfach einen Gartenstuhl in die Mitte zu stellen: Dann bekäme am Ende noch der Kassenwart eigene Befugnisse.\n\nWir bestimmen, welches bisherige Mitglied seinen Platz räumt. Seine Amtsboni werden entfernt und ein laufender Auftrag wird abgebrochen. Bereits abgeschlossene Vorhaben und die erreichte Amtsstufe bleiben für eine spätere Wiedereinsetzung erhalten. Wir können die Nominierung auch zurückziehen."
 wfl_staff.2.d:0 "Die Nominierung zurückziehen."
 wfl_staff.2.a:0 "Sonderplatz 1 neu besetzen."
 wfl_staff.2.b:0 "Sonderplatz 2 neu besetzen."
 wfl_staff.2.c:0 "Sonderplatz 3 neu besetzen."
 WFL_staff_dante_grossy_name:0 "Dante Grossy"
 WFL_staff_dante_grossy_desc:0 "Dante führt Listen, auf denen selbst die Ehrenmedaillen nach Dienstgrad antreten. Als bei einer Parade drei Kompanien gleichzeitig zum Buffet abbogen, erfand er den geordneten Rückweg. Seitdem verwechselt niemand mehr einen Aufnahmeantrag mit einem Getränkebon."
 WFL_staff_appoint_dante_grossy:0 "Dante Grossy in den Schützenrat"
 WFL_staff_appoint_dante_grossy_desc:0 "Dante führt Listen, auf denen selbst die Ehrenmedaillen nach Dienstgrad antreten. Als bei einer Parade drei Kompanien gleichzeitig zum Buffet abbogen, erfand er den geordneten Rückweg. Seitdem verwechselt niemand mehr einen Aufnahmeantrag mit einem Getränkebon.\n\nAls Ratsmitglied: Schützenorganisator. Nach seiner Ernennung bearbeitet er drei eigene Vorhaben automatisch neben unserem normalen Fokus."
 WFL_staff_dante_grossy_autonomous_tt:0 "Nur Dante Grossy kann diesen Fokus automatisch abschließen. Er muss einen Sonderplatz innehaben. Vorbereitung: 75–120 Tage; Aufträge: 140/140/280 Tage. Restzeit des aktuellen Vorhabens: [?WFL_staff_dante_grossy_days|0] Tage. Dieser Fokus belegt unseren nationalen Fokusplatz nicht."
 WFL_staff_dante_grossy_1:0 "Medaillen für Mannschaften"
 WFL_staff_dante_grossy_1_desc:0 "Dante Grossy setzt sein nächstes Vorhaben um: Medaillen für Mannschaften. Dante führt Listen, auf denen selbst die Ehrenmedaillen nach Dienstgrad antreten. Als bei einer Parade drei Kompanien gleichzeitig zum Buffet abbogen, erfand er den geordneten Rückweg. Seitdem verwechselt niemand mehr einen Aufnahmeantrag mit einem Getränkebon.\n\nAutomatischer Auftrag mit 140 Tagen Arbeitszeit nach 75–120 Tagen Vorbereitung. Erhöht seine Amtsstufe und ersetzt die bisherigen Ratsboni durch stärkere. Nach einer Absetzung muss dieser noch nicht abgeschlossene Auftrag mit neuer Vorbereitung vollständig von vorn beginnen."
