 WFL_staff_max_mueller_1_desc:0 "Max Müller setzt sein nächstes Vorhaben um: Der Bierdeckel wird zur Lagekarte. Max plant den Aufbau eines Festzeltes mit derselben Sorgfalt wie einen Feldzug. Sein erster Lageplan entstand auf zwölf zusammengeklebten Bierdeckeln und enthielt bereits eine Nachschubroute. Heute müssen seine Offiziere nicht mehr raten, wo vorne ist: Es steht auf dem Plan, gleich neben der Feldküche.\n\nAutomatischer Auftrag mit 140 Tagen Arbeitszeit nach 75–120 Tagen Vorbereitung. Erhöht seine Amtsstufe und ersetzt die bisherigen Ratsboni durch stärkere. Nach einer Absetzung muss dieser noch nicht abgeschlossene Auftrag mit neuer Vorbereitung vollständig von vorn beginnen."
