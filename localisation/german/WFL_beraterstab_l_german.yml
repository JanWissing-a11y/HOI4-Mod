 WFL_staff_max_mueller_name:0 "Max Müller"
 WFL_staff_max_mueller_desc:0 "Max plant den Aufbau eines Festzeltes mit derselben Sorgfalt wie einen Feldzug. Sein erster Lageplan entstand auf zwölf zusammengeklebten Bierdeckeln und enthielt bereits eine Nachschubroute. Heute müssen seine Offiziere nicht mehr raten, wo vorne ist: Es steht auf dem Plan, gleich neben der Feldküche."
