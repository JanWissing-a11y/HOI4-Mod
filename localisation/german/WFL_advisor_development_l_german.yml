 WFL_advisor_development:0 "Weiterbildung der politischen Berater"
 WFL_advisor_development_desc:0 "Nach dem Abschluss der Berufskolleg können acht bereits amtierende politische Berater für jeweils einmalig 100 politische Macht weitergebildet werden. Die ursprüngliche Eigenschaft wird ersetzt; Anstellung, Porträt und belegter Beraterplatz bleiben erhalten. Die Quellprofile behalten auch ihre ideologischen Wirkungen und Nachteile."
 WFL_advisor_upgrade_01:0 "Erfahrene Sicherheitskoordination"
 WFL_advisor_upgrade_01_desc:0 "Die numerische Aufwertung der deutschen Vorlage bleibt vollständig erhalten: ein Agentenplatz, schnellere Behördenausbauten und die ursprünglichen Besatzungs-/Spionagemodifikatoren."
 WFL_develop_advisor_01:0 "Richard Nachrichtenau: Erfahrene Sicherheitskoordination"
 WFL_develop_advisor_01_desc:0 "Einmalige Weiterbildung für 100 politische Macht nach dem Abschluss der Berufskolleg. Der passende WFL-Berater muss bereits rekrutiert sein und als politischer Berater amtieren. Seine bisherige Eigenschaft wird vollständig durch die Aufwertung ersetzt; es entsteht kein zusätzlicher Beraterplatz. Götterdämmerung ist erforderlich. La Résistance und eine bestehende Geheimdienstbehörde sind zusätzlich erforderlich."
 WFL_advisor_upgrade_02:0 "Militante Verbandsorganisation"
 WFL_advisor_upgrade_02_desc:0 "Die ursprüngliche kommunistische Unterstützung, politischen und militärischen Boni gelten unverändert. Dieses Profil ersetzt ausschließlich die Götterdämmerung-Grundvariante."
 WFL_develop_advisor_02:0 "Jakob Rotacker: Militante Verbandsorganisation"
 WFL_develop_advisor_02_desc:0 "Einmalige Weiterbildung für 100 politische Macht nach dem Abschluss der Berufskolleg. Der passende WFL-Berater muss bereits rekrutiert sein und als politischer Berater amtieren. Seine bisherige Eigenschaft wird vollständig durch die Aufwertung ersetzt; es entsteht kein zusätzlicher Beraterplatz. Götterdämmerung ist erforderlich."
 WFL_advisor_upgrade_03:0 "Ausgebaute Gemeinschaftswirtschaft"
 WFL_advisor_upgrade_03_desc:0 "Die ursprünglichen Industrie-, Ressourcen- und Rohstoffmangelwerte bleiben erhalten; Infrastruktur und Zivilfabriken erhalten zusätzlich die exakten Baugeschwindigkeitswerte der Aufwertung."
 WFL_develop_advisor_03:0 "Alfred Gemeinschaft: Ausgebaute Gemeinschaftswirtschaft"
 WFL_develop_advisor_03_desc:0 "Einmalige Weiterbildung für 100 politische Macht nach dem Abschluss der Berufskolleg. Der passende WFL-Berater muss bereits rekrutiert sein und als politischer Berater amtieren. Seine bisherige Eigenschaft wird vollständig durch die Aufwertung ersetzt; es entsteht kein zusätzlicher Beraterplatz. Götterdämmerung ist erforderlich."
 WFL_advisor_upgrade_04:0 "Durchsetzungsstarke Staatsplanung"
 WFL_advisor_upgrade_04_desc:0 "Alle Quellwerte werden übernommen, einschließlich kommunistischer Unterstützung und des Nachteils von -5 Prozent Wachstum der Produktionseffizienz."
 WFL_develop_advisor_04:0 "Viktor Ordnau: Durchsetzungsstarke Staatsplanung"
 WFL_develop_advisor_04_desc:0 "Einmalige Weiterbildung für 100 politische Macht nach dem Abschluss der Berufskolleg. Der passende WFL-Berater muss bereits rekrutiert sein und als politischer Berater amtieren. Seine bisherige Eigenschaft wird vollständig durch die Aufwertung ersetzt; es entsteht kein zusätzlicher Beraterplatz. Götterdämmerung ist erforderlich."
 WFL_advisor_upgrade_05:0 "Umfassendes Reformprogramm"
 WFL_advisor_upgrade_05_desc:0 "Die exakten Produktions-, Macht- und Demokratieboni sowie jeweils -25 Akzeptanz für kommunistische und faschistische Diplomatie bleiben erhalten. Die ursprüngliche Rollenbedingung sperrt die Wirkung unter demokratischer Regierung."
 WFL_develop_advisor_05:0 "Daniel Wiesenbrück: Umfassendes Reformprogramm"
 WFL_develop_advisor_05_desc:0 "Einmalige Weiterbildung für 100 politische Macht nach dem Abschluss der Berufskolleg. Der passende WFL-Berater muss bereits rekrutiert sein und als politischer Berater amtieren. Seine bisherige Eigenschaft wird vollständig durch die Aufwertung ersetzt; es entsteht kein zusätzlicher Beraterplatz. Götterdämmerung ist erforderlich. Nur unter einer nicht demokratischen Regierung nutzbar: Die ursprüngliche do_effect-Bedingung der Rolle bleibt bestehen."
 WFL_advisor_upgrade_06:0 "Erweiterte Geheimdienstleitung"
 WFL_advisor_upgrade_06_desc:0 "Die unveränderte Quellaufwertung gewährt zwei Agentenplätze sowie die ursprünglichen Behörden-, Besatzungs- und Spionagemodifikatoren."
 WFL_develop_advisor_06:0 "Adrian Falkenried: Erweiterte Geheimdienstleitung"
 WFL_develop_advisor_06_desc:0 "Einmalige Weiterbildung für 100 politische Macht nach dem Abschluss der Berufskolleg. Der passende WFL-Berater muss bereits rekrutiert sein und als politischer Berater amtieren. Seine bisherige Eigenschaft wird vollständig durch die Aufwertung ersetzt; es entsteht kein zusätzlicher Beraterplatz. Götterdämmerung ist erforderlich. La Résistance und eine bestehende Geheimdienstbehörde sind zusätzlich erforderlich."
 WFL_advisor_upgrade_07:0 "Erfahrene Geheimdienstvertretung"
 WFL_advisor_upgrade_07_desc:0 "Die unveränderte Quellaufwertung ersetzt das bisherige Profil durch einen Agentenplatz, Geheimdienstabwehr und verbesserten Netzwerkaufbau."
 WFL_develop_advisor_07:0 "Leonhard Freihagen: Erfahrene Geheimdienstvertretung"
 WFL_develop_advisor_07_desc:0 "Einmalige Weiterbildung für 100 politische Macht nach dem Abschluss der Berufskolleg. Der passende WFL-Berater muss bereits rekrutiert sein und als politischer Berater amtieren. Seine bisherige Eigenschaft wird vollständig durch die Aufwertung ersetzt; es entsteht kein zusätzlicher Beraterplatz. Götterdämmerung ist erforderlich. La Résistance und eine bestehende Geheimdienstbehörde sind zusätzlich erforderlich. Auch Waking the Tiger wird wie bei der Grundrolle benötigt."
 WFL_advisor_upgrade_08:0 "Erweiterte Überseeverwaltung"
 WFL_advisor_upgrade_08_desc:0 "Politischer Machtgewinn, Personal aus Nicht-Kerngebieten, Besatzungswerte und Milizorganisation entsprechen exakt der verbesserten deutschen Vorlage."
 WFL_develop_advisor_08:0 "August Fernbach: Erweiterte Überseeverwaltung"
 WFL_develop_advisor_08_desc:0 "Einmalige Weiterbildung für 100 politische Macht nach dem Abschluss der Berufskolleg. Der passende WFL-Berater muss bereits rekrutiert sein und als politischer Berater amtieren. Seine bisherige Eigenschaft wird vollständig durch die Aufwertung ersetzt; es entsteht kein zusätzlicher Beraterplatz. Götterdämmerung ist erforderlich."
