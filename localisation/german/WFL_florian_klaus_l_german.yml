 WFL_florian_klaus:0 "Florian Klaus"
 WFL_florian_klaus_desc:0 "Mit kühlem Kopf, ruhiger Pfeife und einem sicheren Gespür für volle Auftragsbücher hält Florian Klaus die Flürener Wirtschaft auf Kurs. Solange er als politischer Berater amtiert, steigen Zivil- und Militärfabrikbau um je 20 %, die Fabrikleistung um 15 % und die Stabilität um 10 Prozentpunkte."
 WFL_wirtschaftsstratege_mit_ruhiger_hand:0 "Wirtschaftsstratege mit ruhiger Hand"
 WFL_wirtschaftsstratege_mit_ruhiger_hand_desc:0 "Mehr Fabriken, höhere Produktion und ein verlässlicher Staatshaushalt sorgen für zufriedene Schützen und ruhige Verhältnisse."
