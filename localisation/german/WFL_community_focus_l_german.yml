l_german:
 WFL_brauereiverbund:0 "Der Flürener Brauereiverbund"
 WFL_brauereiverbund_desc:0 "Unsere Brauereien schließen sich zusammen. Der Kassenwart entdeckt, dass Lieferwagen auch Maschinen transportieren können, solange niemand die Zapfanlage damit verwechselt. Dauerhaft 10 Prozent schnellerer Zivilfabrikbau und ein Ereignis mit zwei unterschiedlichen Festbelohnungen folgen."
 WFL_festlogistik:0 "Nachschub nach Schützenfestmaß"
 WFL_festlogistik_desc:0 "Wer ein Festzelt mit Getränken, Essen und trockenen Socken versorgt bekommt, kann auch einen militärischen Nachschubplan lesen. Eine zentrale Logistik senkt den Versorgungsverbrauch unserer Armee dauerhaft um 8 Prozent."
 WFL_schuetzenakademie:0 "Die Schützenakademie Flüren"
 WFL_schuetzenakademie_desc:0 "Auf dem Lehrplan stehen Führung, Zusammenarbeit und die erstaunliche Erkenntnis, dass eine Marschkolonne auch ohne Blaskapelle vorankommt. Wir erhalten 15 Armeeerfahrung und dauerhaft 5 Prozent zusätzliche Armeeorganisation."
 WFL_vereinsdiplomatie:0 "Außenpolitik mit Vereinsnadel"
 WFL_vereinsdiplomatie_desc:0 "Unsere Diplomaten reisen mit Gastgeschenken und einem erstaunlich umfangreichen Vereinskalender. Die laufenden Kosten zur Verbesserung diplomatischer Beziehungen sinken dauerhaft um 15 Prozent."
 WFL_schuetzenolympiade:0 "Die große Schützenolympiade"
 WFL_schuetzenolympiade_desc:0 "Jan lädt zum sportlichen Wettstreit. Beim Fahnenappell wird noch diskutiert, ob der Pokal leer übergeben werden darf. Ein Wahlereignis entscheidet zwischen militärischer Übung und zusätzlichem Vereinsnachwuchs."
 WFL_weltkongress_des_schuetzenwesens:0 "Weltkongress des Schützenwesens"
 WFL_weltkongress_des_schuetzenwesens_desc:0 "Nach der Olympiade lädt Jan Gäste aus aller Welt ein. Die Bürgerhalle hat Weltpolitik schon immer für eine Frage ausreichender Tischlänge gehalten. Im anschließenden Ereignis wählen wir Verständigung oder zusätzliche Rekrutierung."
 WFL_tag_der_offenen_labortuer:0 "Tag der offenen Labortür"
 WFL_tag_der_offenen_labortuer_desc:0 "Die Forschung öffnet ihre Türen. Die Besuchenden dürfen alles fragen; nur die Kaffeemaschine steht wegen strategischer Bedeutung unter besonderer Aufsicht. Ein Wahlereignis bietet einen Industrieforschungsbonus oder politische Unterstützung."
 WFL_rheinischer_forschungsbund:0 "Der Rheinische Forschungsbund"
 WFL_rheinischer_forschungsbund_desc:0 "Berufskolleg, Labor und örtliche Werkstätten teilen ihre Ergebnisse. Selbst der Kassenwart muss zugeben, dass eine Idee auch dann wertvoll sein kann, wenn sie keinen Pfandwert hat. Unsere allgemeine Forschungsgeschwindigkeit steigt dauerhaft um 5 Prozent."
 WFL_jans_goldene_festordnung:0 "Jans goldene Festordnung"
 WFL_jans_goldene_festordnung_desc:0 "Jan Graf von Insel I. verabschiedet ein königliches Regelwerk für geordnete Verwaltung und außergewöhnlich gut geplante Feste. Solange er regiert, erhalten wir 5 Prozent Stabilität und 100 politische Macht. Bei einem zwischenzeitlichen Führungswechsel bleiben 25 politische Macht für die Verwaltung."
 WFL_buergerhalle_fuer_alle:0 "Eine Bürgerhalle für alle"
 WFL_buergerhalle_fuer_alle_desc:0 "Die Bürgerrepublik verbindet ihre freie Forschung mit einer offenen kommunalen Verwaltung. Unter demokratischer Regierung erhalten wir 10 Prozent Stabilität und 75 politische Macht. Geht diese Regierungsform während der Vorbereitung verloren, bleiben 25 politische Macht."
 WFL_schuetzenbund_am_niederrhein:0 "Der Schützenbund am Niederrhein"
 WFL_schuetzenbund_am_niederrhein_desc:0 "Nach der wirklichen Vereinigung des Rheinlands und Westfalens baut Jan eine gemeinsame Verwaltung auf. Bei weiterhin vollständig kontrollierten Kerngebieten und Frieden erhalten wir 10 Prozent Kriegsunterstützung, 25 Armeeerfahrung und 100 politische Macht. Andernfalls gibt es 25 politische Macht."
