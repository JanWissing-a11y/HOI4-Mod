 WFL_gewerbehoefe:0 "Gewerbehöfe am Niederrhein"
 WFL_gewerbehoefe_desc:0 "Gemeinsame Werkstätten und abgestimmte Lieferungen verbessern den Anlauf unserer Fertigung."
 WFL_ruestungswerkstatt:0 "Die Rüstungswerkstatt"
 WFL_ruestungswerkstatt_desc:0 "Ein kleiner Rüstungsbetrieb entsteht im eigenen, kontrollierten Hauptstadtstaat. Fehlen Kontrolle oder freie Bauplätze, erhalten wir stattdessen 50 politische Macht für die Neuplanung."
 WFL_technikschule:0 "Das Berufskolleg Wesel"
 WFL_technikschule_desc:0 "Das Berufskolleg Wesel verbindet praktische Ausbildung mit moderner Forschung. Wir erhalten dauerhaft 5 Prozent Forschungsgeschwindigkeit, zwei Industrieforschungsboni von je 100 Prozent und einen zusätzlichen Forschungsplatz. Haben wir bereits mindestens vier Plätze, erhalten wir statt des Platzes 75 politische Macht. Der separate Forschungsrat gewährt weiterhin seinen eigenen zusätzlichen Platz."
 WFL_berliner_tor_sichern:0 "Das Berliner Tor sichern"
 WFL_berliner_tor_sichern_desc:0 "Eine einheitliche Grundausbildung und vorbereitete Alarmpläne beschleunigen die Ausbildung unserer Heimatverteidigung."
 WFL_standardisierte_gewehre:0 "Einheitliche Gewehre"
 WFL_standardisierte_gewehre_desc:0 "Eine einmalige staatliche Bestellung von 250 Infanteriewaffen vereinheitlicht die Bewaffnung unserer Verbände."
 WFL_offene_haushalte:0 "Offene Haushalte"
 WFL_offene_haushalte_desc:0 "Öffentliche Haushaltsdebatten und nachvollziehbare Ausgaben stärken die Bürgerrepublik."
 WFL_forschungsgemeinschaft:0 "Eine freie Forschungsgemeinschaft"
 WFL_forschungsgemeinschaft_desc:0 "Die Berufskolleg und der Bürgerrat verbinden angewandte Forschung mit freiem wissenschaftlichem Austausch."
 WFL_bewaffnete_neutralitaet:0 "Bewaffnete Neutralität"
 WFL_bewaffnete_neutralitaet_desc:0 "Das Königreich organisiert Vorräte und Transportwege für eine genügsame Verteidigungsarmee. Unsere Neutralität muss durch eigene Vorbereitung getragen werden."
 WFL_mobilmachungsplan:0 "Der Mobilmachungsplan"
 WFL_mobilmachungsplan_desc:0 "Die Schützenverwaltung unter Jan Graf von Insel I. erfasst Freiwillige und stellt einen begrenzten zusätzlichen Teil der Bevölkerung für den Wehrdienst bereit."
 WFL_gewerbliche_zusammenarbeit:0 "Gewerbliche Zusammenarbeit"
 WFL_gewerbliche_zusammenarbeit_desc:0 "Abgestimmte Zulieferer beschleunigen den Aufbau unserer Produktionseffizienz."
 WFL_heimatverteidigung:0 "Vorbereitete Heimatverteidigung"
 WFL_heimatverteidigung_desc:0 "Gemeinsame Ausbildungspläne verkürzen die Grundausbildung regionaler Einheiten."
 WFL_buergerhaushalt:0 "Der Bürgerhaushalt"
 WFL_buergerhaushalt_desc:0 "Ein transparenter Haushalt gibt unserer demokratischen Ordnung Rückhalt."
 WFL_freie_wissenschaft:0 "Freie Wissenschaft am Niederrhein"
 WFL_freie_wissenschaft_desc:0 "Die Zusammenarbeit unserer Forschungsstellen verbessert das Tempo wissenschaftlicher Arbeit."
 WFL_bewaffnete_neutralitaet_idee:0 "Versorgung der Neutralität"
 WFL_bewaffnete_neutralitaet_idee_desc:0 "Sorgfältige Vorratshaltung senkt den Nachschubverbrauch unserer Armee."
 WFL_reserveorganisation:0 "Geordnete Reserveorganisation"
 WFL_reserveorganisation_desc:0 "Ein verbindliches Register erschließt zusätzlich 0,5 Prozent der Bevölkerung für den Wehrdienst."
 WFL_instandsetzungsdienst_idee:0 "Kommunaler Instandsetzungsdienst"
 WFL_instandsetzungsdienst_idee_desc:0 "Für begrenzte Zeit koordinieren örtliche Handwerker die Reparatur beschädigter Gebäude."
 WFL_instandsetzungsdienst:0 "Instandsetzungsdienst beauftragen"
 WFL_instandsetzungsdienst_desc:0 "40 politische Macht finanzieren 90 Tage lang eine um 15 Prozent verbesserte Reparaturleistung. Nach 180 Tagen kann der Auftrag erneut vergeben werden."
 WFL_munitionsreserve:0 "Eine Ausrüstungsreserve beschaffen"
 WFL_munitionsreserve_desc:0 "Für 50 politische Macht beschaffen wir einmalig 150 weitere Infanteriewaffen."
 WFL_buergerforum:0 "Ein Bürgerforum einberufen"
 WFL_buergerforum_desc:0 "Ein einmaliges öffentliches Forum stärkt die Stabilität der Bürgerrepublik."
 WFL_ehrengarde:0 "Die Ehrengarde ausbilden"
 WFL_ehrengarde_desc:0 "Ein einmaliger Lehrgang der Königsgarde vermittelt zusätzliche Armeeerfahrung."
 WFL_freiwilligenreserve:0 "Die Freiwilligenreserve einziehen"
 WFL_freiwilligenreserve_desc:0 "Die Schützenverwaltung ruft einmalig 1.000 bereits erfasste Freiwillige zum Dienst unter Jan Graf von Insel I. Die Organisation kostet 75 politische Macht."
 wfl.3.t:0 "Schützenverwaltung unter Jan Graf von Insel I."
 wfl.3.d:0 "Jan Graf von Insel I. richtet einen gemeinsamen Schützenverwaltungsrat für Ämter und Landesverteidigung ein. Er bleibt selbst Staatsoberhaupt und Anführer des Schützenwesens. Der neue Rat koordiniert die Ausführung seiner Beschlüsse."
 wfl.3.a:0 "Im Dienst des Schützenwesens."
 wfl.4.t:0 "Eine Forschungsgemeinschaft wächst"
 wfl.4.d:0 "Handwerker, Lehrkräfte und junge Forschende arbeiten künftig gemeinsam an den Aufgaben unseres kleinen Staates. Die Bürgerrepublik gewinnt einen Ort für praktische Forschung und freien Austausch."
 wfl.4.a:0 "Wissen schafft Zukunft."
 WFL_niederrheinische_ansprueche:0 "Niederrheinische Ansprüche"
 WFL_niederrheinische_ansprueche_desc:0 "Die Schützenverwaltung unter Jan Graf von Insel I. erhebt Ansprüche auf das übrige Rheinland und Westfalen. Diese Forderungen übertragen noch kein Gebiet: Jeder Besitzer wird seine Interessen verteidigen."
 WFL_rheinland_fordern:0 "Das Rheinland fordern"
 WFL_rheinland_fordern_desc:0 "Wir bereiten ein Kriegsziel auf den verbleibenden Staat Rheinland gegen dessen aktuellen Besitzer vor. Verbündete, eigene Untertanen und bereits bestehende Kriegsgegner sind ausgenommen. Ändern sich diese Bedingungen während der Vorbereitung, erhalten wir stattdessen 50 politische Macht. Bereits eigener Besitz überspringt diesen Fokus. Ein Kriegsziel erklärt noch keinen Krieg und garantiert keinen Sieg."
 WFL_westfalen_fordern:0 "Westfalen fordern"
 WFL_westfalen_fordern_desc:0 "Wir bereiten ein Kriegsziel auf Westfalen gegen dessen aktuellen Besitzer vor. Verbündete, eigene Untertanen und bereits bestehende Kriegsgegner sind ausgenommen. Ändern sich diese Bedingungen während der Vorbereitung, erhalten wir stattdessen 50 politische Macht. Bereits eigener Besitz überspringt diesen Fokus. Die spätere Integration setzt tatsächlich gewonnenen Besitz voraus."
 WFL_niederrheinunion:0 "Die Niederrheinunion ausrufen"
 WFL_niederrheinunion_desc:0 "Erst wenn Rheinland und Westfalen uns gehören, vollständig kontrolliert und integriert sind, kann Jan Graf von Insel I. mit seiner Schützenverwaltung im Frieden die regionale Union ausrufen. Die Proklamation schafft keine zusätzlichen Gebietsgeschenke. Geht während der Vorbereitung die Kontrolle verloren oder beginnt ein Krieg, erhalten wir stattdessen 25 politische Macht."
 WFL_rheinland_integrieren:0 "Das Rheinland integrieren"
 WFL_rheinland_integrieren_desc:0 "Für einmalig 100 politische Macht wird der verbleibende Staat Rheinland zu unserem Kerngebiet. Wir müssen den Staat nach Abschluss des Gebietsfokus tatsächlich besitzen und vollständig kontrollieren; unser Land muss im Frieden sein. Besetzung während eines Krieges genügt nicht."
 WFL_westfalen_integrieren:0 "Westfalen integrieren"
 WFL_westfalen_integrieren_desc:0 "Für einmalig 150 politische Macht wird Westfalen zu unserem Kerngebiet. Wir müssen den Staat nach Abschluss des Gebietsfokus tatsächlich besitzen und vollständig kontrollieren; unser Land muss im Frieden sein. Diese Entscheidung überträgt kein fremdes Gebiet."
