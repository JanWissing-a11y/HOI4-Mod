 WFL_schuetzenkoenig:0 "Jan Graf von Insel I."
 WFL_direktorium:0 "Schützenverwaltungsrat"
 WFL_kleine_verwaltung:0 "Eine Verwaltung im Aufbau"
 WFL_kleine_verwaltung_desc:0 "Wenige Hände müssen die Aufgaben eines ganzen Staates bewältigen."
 WFL_rheinhandel:0 "Rheinhandel"
 WFL_rheinhandel_desc:0 "Kontakte entlang des Rheins beschleunigen dauerhaft den Bau von Zivilfabriken und Militärfabriken um jeweils 15 Prozent."
 WFL_schuetzenverbaende:0 "Regionale Schützenverbände"
 WFL_schuetzenverbaende_desc:0 "Ortskenntnis und regelmäßige Übungen stärken unsere Verteidigung."
 WFL_koenigsgarde:0 "Die Königsgarde"
 WFL_koenigsgarde_desc:0 "Ein kleiner, gut organisierter Verband bildet den Kern der königlichen Streitkräfte."
 WFL_rat_der_buergerhalle:0 "Der Rat der Bürgerhalle"
 WFL_rat_der_buergerhalle_desc:0 "Die Bürgerhalle wird zum Ausgangspunkt unserer staatlichen Organisation."
 WFL_werkbank_am_niederrhein:0 "Werkbank am Niederrhein"
 WFL_werkbank_am_niederrhein_desc:0 "Handwerk und Gewerbe errichten eine Zivilfabrik im eigenen, kontrollierten Hauptstadtstaat. Fehlen Kontrolle oder freie Bauplätze, fließen stattdessen 50 politische Macht in die weitere Planung."
 WFL_rheinhandel_beleben:0 "Rheinhandel beleben"
 WFL_rheinhandel_beleben_desc:0 "Wir verbinden Hafenbetriebe, Werkstätten und Handelshäuser. Zivilfabriken und Militärfabriken werden dadurch dauerhaft jeweils 15 Prozent schneller gebaut."
 WFL_schuetzen_zu_soldaten:0 "Schützen zu Soldaten"
 WFL_schuetzen_zu_soldaten_desc:0 "Aus freiwilligen Verbänden soll eine verlässlich organisierte Verteidigung entstehen."
 WFL_uebungsplatz_am_auesee:0 "Übungsplatz am Auesee"
 WFL_uebungsplatz_am_auesee_desc:0 "Gemeinsame Übungen sollen die Zusammenarbeit unserer Verbände verbessern."
 WFL_buergerverfassung:0 "Die Bürgerverfassung"
 WFL_buergerverfassung_desc:0 "Eine gewählte Vertretung soll künftig über die Geschicke unseres Landes entscheiden."
 WFL_kommunaler_aufbau:0 "Kommunaler Aufbau"
 WFL_kommunaler_aufbau_desc:0 "Verlässliche kommunale Einrichtungen festigen das Vertrauen in die Bürgerrepublik und überwinden die Schwächen der provisorischen Verwaltung."
 WFL_die_krone_von_flueren:0 "Die Krone von Flüren"
 WFL_die_krone_von_flueren_desc:0 "Jan Graf von Insel I. verankert seine bereits bestehende Führung förmlich in der Schützentradition. Die Krönungsfeier stärkt sein Amt und die Bindung der örtlichen Verbände."
 WFL_die_koenigsgarde:0 "Die Königsgarde aufstellen"
 WFL_die_koenigsgarde_desc:0 "Die Krone benötigt eine verlässliche militärische Organisation."
 WFL_niederrhein_direktorium:0 "Die Schützenverwaltung"
 WFL_niederrhein_direktorium_desc:0 "Jan Graf von Insel I. bündelt Verwaltung und Verteidigung in einer straff organisierten Schützenverwaltung. Er bleibt selbst Anführer des Schützenwesens; der Verwaltungsrat führt seine Beschlüsse aus."
 WFL_verwaltung_buendeln:0 "Die Verwaltung bündeln"
 WFL_verwaltung_buendeln_desc:0 "Die Schützenverwaltung unter Jan Graf von Insel I. schafft klare Zuständigkeiten und überwindet die Schwächen der provisorischen Ämter."
 wfl.1.t:0 "Die Krone von Flüren"
 wfl.1.d:0 "Jan Graf von Insel I. führt Flüren bereits als Oberhaupt des Schützenwesens. In der Bürgerhalle bekräftigt nun eine feierliche Krönung seine Stellung. Bürgerrat und Schützenverbände verpflichten sich, Tradition und staatliche Verantwortung gemeinsam zu tragen."
 wfl.1.a:0 "Lang lebe der Schützenkönig!"
 wfl.2.t:0 "Eine Verfassung für die Bürger"
 wfl.2.d:0 "Jan Graf von Insel I. überträgt die Regierung im Rahmen der neuen Verfassung einem gewählten Bürgerpräsidium. Der demokratische Weg bildet eine ausdrückliche Alternative zur bisherigen Führung durch das Schützenwesen."
 wfl.2.a:0 "Die Verantwortung liegt bei den Bürgern."
 WFL_local_initiatives:0 "Initiativen am Niederrhein"
 WFL_local_initiatives_desc:0 "Gezielte Vorhaben unterstützen den Aufbau unseres kleinen Staates."
 WFL_organisiertes_exerzieren:0 "Gemeinsames Exerzieren"
 WFL_organisiertes_exerzieren_desc:0 "Eine einmalige Übung vertieft die militärische Erfahrung unserer Verbände."
 WFL_rheinhandelsmesse:0 "Eine Rheinhandelsmesse ausrichten"
 WFL_rheinhandelsmesse_desc:0 "Eine einmalige Messe stärkt das Vertrauen in die wirtschaftliche Zukunft."
