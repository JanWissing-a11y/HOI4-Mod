l_german:
 WFL_geschaeftsordnung_bierdeckel:0 "Geschäftsordnung auf Bierdeckeln"
 WFL_geschaeftsordnung_bierdeckel_desc:0 "Nach der dritten Debatte über die Reihenfolge der Debatten bringt der Schriftführer eine Geschäftsordnung mit. Weil die Rückseite des Kassenbuchs bereits als Grillanzünder eingeplant ist, passt das gesamte Regelwerk auf einen Bierdeckel: ausreden lassen, Anträge nummerieren, fremde Runden nicht versprechen. So verliert der Vorstand bei politischer Einflussnahme künftig ein Viertel weniger Stimmung."
 WFL_board_bierdeckel_rules_tt:0 "Alle Stimmungsverluste durch Einflussnahme sinken dauerhaft um §G25%§!: Grundverlust §Y9§! statt 12; bei Verärgerung eines anderen Mitglieds zusätzlich §Y4,5§! statt 6; bei eigener Verärgerung zusätzlich §Y6§! statt 8. Kosten, Abstimmungschancen und Streitfolgen der Versammlungen bleiben bestehen."
 WFL_aeltestenrat_tresen:0 "Der Ältestenrat am Tresen"
 WFL_aeltestenrat_tresen_desc:0 "Drei erfahrene Schützen erklären, sie hätten schon ganz andere Vereinskrisen ausgesessen – meistens genau auf diesen Barhockern. Der Graf ernennt den Tresen zum Schlichtungstisch. Bei einem verärgerten Vorstandsmitglied kann der Ältestenrat nun vermitteln: erst zuhören, dann gemeinsam die Rechnung prüfen, zum Schluss wieder miteinander reden. Eine zugesagte Stimme gibt es dadurch noch lange nicht."
 WFL_board_elders_unlocked_tt:0 "Schaltet die Entscheidung §YÄltestenrat vermitteln lassen§! frei: Für §Y50§! politische Macht wird ein verärgertes Vorstandsmitglied beruhigt und die allgemeine Stimmung steigt um §G10§! Punkte. 30 Tage Abklingzeit."
 WFL_board_aeltestenrat_vermitteln:0 "Ältestenrat vermitteln lassen"
 WFL_board_aeltestenrat_vermitteln_desc:0 "Der Ältestenrat holt §Y[WFLBoardEldersTarget]§! an den Tresen. Nach einer ernsthaften Aussprache über enttäuschte Erwartungen und falsch verteilte Bratwürste legt dieses Mitglied seinen Ärger für die nächste Versammlung ab.\n\n§Y50§! politische Macht; §G+10§! allgemeine Stimmung; beruhigt genau ein verärgertes Mitglied. 30 Tage Abklingzeit. Bei mehreren Verärgerten wird in der Reihenfolge der Porträts vermittelt. Bereits genutzte Einflussnahmen bleiben verbraucht; bestehende Zusagen bleiben erhalten, neue Zusagen werden nicht vergeben."
