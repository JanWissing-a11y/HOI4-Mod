l_german:
 WFL_dorfkeller_diplomatie:0 "Dorfkeller Diplomatie"
 WFL_dorfkeller_diplomatie_desc:0 "Nach der Anglo-Bier-Diplomatie und der Zapfhahnkrise laden wir die britische Delegation in den Dorfkeller ein. Zwischen Kegelbahn und Zapfanlage wird aus Freundschaft ein Bündnis. Nach 35 Tagen treten wir den Alliierten bei, sofern Großbritannien ihnen noch angehört, ihre aktuelle Führung handlungsfähig ist, Flüren unabhängig, nicht kapituliert und bündnislos ist und kein Krieg mit einem alliierten Mitglied besteht. Der Ausgang der Zapfhahnkrise ist keine zusätzliche Voraussetzung. Scheitert der Abschluss an veränderten Umständen, erhalten wir einmalig 50 politische Macht."
 WFL_dorfkeller_voraussetzungen_tt:0 "Flüren ist unabhängig, nicht kapituliert und bündnislos. Großbritannien existiert und gehört den Alliierten an. Die aktuelle Bündnisführung existiert, ist unabhängig und nicht kapituliert. Wir führen keinen Krieg gegen ein Mitglied der Alliierten. Der Beitritt ist unabhängig von der britischen Regierungsform und vom Ausgang der Zapfhahnkrise."
 WFL_dorfkeller_beitritt_tt:0 "Flüren tritt bei gültigen Voraussetzungen sofort den Alliierten bei. Anschließend feiern wir den Dorfkeller-Vertrag. Ist der Beitritt beim Abschluss unmöglich geworden, erhalten wir einmalig §G50§! politische Macht."
 wfl_dorfkeller.1.t:0 "Der Dorfkeller-Vertrag"
 wfl_dorfkeller.1.d:0 "Die britische Delegation sucht den Konferenzsaal und landet vor der Kegelbahn. Ein Schütze hängt kurzerhand ein Schild auf: ALLIIERTER SITZUNGSSAAL – BAHN ZWEI. [WFL.GetLeader] begrüßt die Gäste am Stammtisch, während der Wirt versichert, diesmal sei das Bier tatsächlich kalt.\n\nAls [ENG.GetLeader] nach einem Vertragsentwurf fragt, schiebt der Kassenwart einen Bierdeckel über den Tisch. Vorderseite: gegenseitiger Beistand. Rückseite: Wer zuletzt geht, bringt die Gläser hoch. Nach einer Ehrenrunde unterschreibt die Delegation beide Seiten. London bestätigt den Beitritt Flürens zu den Alliierten; nur die Frage, ob die Kegelbahn nun als diplomatisches Parkett gilt, bleibt offen.\n\nDer Wirt rahmt die Urkunde ein. Den Pfandbon legt er vorsichtshalber ins Staatsarchiv."
 wfl_dorfkeller.1.a:0 "Auf die Alliierten! Die nächste Runde geht auf Flüren."
