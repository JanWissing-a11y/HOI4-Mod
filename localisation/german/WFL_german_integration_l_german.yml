l_german:
 WFL_deutsche_einigung:0 "Ein Schützenhut für ganz Deutschland"
 WFL_deutsche_einigung_desc:0 "Deutschlands Startgebiete vom 1. Januar 1936 genügen für die Einigung unter dem Schützenhut. Weitere Gebietsansprüche bleiben bestehen. Der Sonderbonus für die kleine Heimat wird durch neue Kernbevölkerung ersetzt."
 WFL_deutschland_unter_schuetzenhut_vereinen:0 "Deutschland unter dem Schützenhut vereinen"
 WFL_deutschland_unter_schuetzenhut_vereinen_desc:0 "Wenn sämtliche deutschen Startgebiete vom 1. Januar 1936 einschließlich Flürens uns gehören und vollständig von uns kontrolliert werden, erhalten sie kostenlos unsere Kerne. Weitere aktuelle deutsche Kerngebiete werden ebenfalls gekernt, wenn sie uns gehören und vollständig kontrolliert werden. Danzig, Memel, Gdingen, Posen und Kattowitz sind keine Voraussetzung: Auf fremd gehaltene Gebiete dieser Regionen und weitere deutsche Kerngebiete erhalten wir Ansprüche. Bestehende Ansprüche bleiben erhalten. Der Staatsgeist „Ein Volk unter dem Schützenhut“ mit seinen +20 Prozentpunkten rekrutierbarer Bevölkerung entfällt. Einmaliger Abschluss; bloße Besetzung oder Teilkontrolle der erforderlichen Gebiete genügt nicht. Unser Staat erhält den Namen §YGroß Flürener Reich§!."
