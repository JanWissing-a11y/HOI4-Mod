l_german:
 WFL_iran_erbfolgekrise:0 "Teheraner Thronstolpern"
 WFL_iran_erbfolgekrise_desc:0 "Eine Serie höchst dubioser Unfälle hat die iranische Thronfolge gründlich durcheinandergebracht. Der Graf lässt die Stammbäume prüfen: Zwischen den vielen Trauerschleifen scheint noch Platz für ein grün-weißes Band zu sein. Dieser Weg steht einem unabhängigen, nicht kapitulierten Wesel-Flüren offen."
 WFL_iran_gesandtschaft:0 "Höhnes persische Mission"
 WFL_iran_gesandtschaft_desc:0 "Chefdiplomat Lukas Höhne reist mit tadellosen Manieren, einem Koffer voller Orden und bemerkenswert wenig Ahnung vom Hofzeremoniell nach Teheran. Sein Auftrag: Prinzessin Shirin kennenlernen und die Zukunft der beiden Höfe miteinander verknüpfen."
 WFL_iran_hochzeit:0 "Liebe geht durch den Zapfhahn"
 WFL_iran_hochzeit_desc:0 "Zwischen höfischen Empfängen, einem verirrten Schützenmarsch und langen Gesprächen entsteht eine Romanze. Prinzessin Shirin und Lukas Höhne entscheiden sich füreinander. Nun muss nur noch ein Hofjurist erklären, weshalb auf den Einladungen plötzlich auch der Flürener Vereinsvorstand steht."
 WFL_iran_treuevertrag:0 "Al Höhne und der Treuevertrag"
 WFL_iran_treuevertrag_desc:0 "Die verstaubte Erbfolgeordnung des Palastes erlaubt ausschließlich einem Mann die Krone. Shirin setzt deshalb ihren zukünftigen Gemahl als Schah Al Höhne durch. Er unterschreibt seine Treue zu Flüren unmittelbar unter der Heiratsurkunde. Aus einer Dienstreise wird eine Dynastie, aus dem Eheversprechen ein besonders weitreichender Freundschaftsvertrag."
 WFL_iran_treuevertrag_tt:0 "§YIran§! wird unmittelbar eine §YMarionette Wesel-Flürens§!. §YAl Höhne§! übernimmt mit dem neuen Porträt die neutrale Regierung. Ein bisheriger Oberherr wird abgelöst. Ein annektierter Iran wird aus seinen Kerngebieten wiederhergestellt; falls sämtliche iranischen Kerne entfernt wurden, dient Teheran als Anker. Keine Zufallschance und keine fremde Zustimmung erforderlich. Der Feldmarschall Lukas Höhne I. bleibt verfügbar."
 WFL_PER_al_hoehne:0 "Al Höhne"
 WFL_PER_al_hoehne_desc:0 "Als Lukas Höhne kam er mit diplomatischem Gepäck nach Teheran. Als Al Höhne verlässt er den Trausaal mit Krone, Zigarre und einem Flürener Treuevertrag. Seine neue iranische Herrscherrolle ändert nichts an seiner Verbundenheit zum Grafen."
 WFL_PER_fluerentreuer_schah:0 "Flürentreuer Schah"
 WFL_PER_fluerentreuer_schah_desc:0 "Mit höfischem Charme und verlässlicher Bindung an Flüren erhöht Al Höhne den politischen Machtgewinn um 5 % und die Stabilität um 5 Prozentpunkte."
 wfl_iran_succession.1.t:0 "Die Krone sucht einen Kopf"
 wfl_iran_succession.1.d:0 "In Teheran häufen sich Telegramme mit schwarzem Rand. Ein Thronanwärter starb bei einem unerklärlichen Unfall im Palast, ein weiterer nach einem Jagdausflug, dessen Bericht hauptsächlich aus geschwärzten Seiten besteht. Der Hofsprecher nennt die Ereignisse eine bedauerliche Verkettung unglücklicher Umstände. Selbst der Hausmeister wirkt nicht überzeugt.\n\nDie erwachsene Prinzessin Shirin hält derweil den Hofbetrieb zusammen, während Verwandte nervös ihre Stammbäume nachzählen. In Flüren betrachtet der Graf die Lage, nimmt einen Schluck und sagt: 'Eine offene Thronfolge? Das klingt nach einem Fall für unseren Chefdiplomaten.' Lukas Höhne erhält einen Reisekoffer und die dringende Anweisung, im Palast keine Unfallprotokolle zu unterschreiben."
 wfl_iran_succession.1.a:0 "Höhne, du bist jetzt für Außen und Innen zuständig."
 wfl_iran_succession.2.t:0 "Ein Schütze am Pfauenthron"
 wfl_iran_succession.2.d:0 "Lukas Höhne betritt den Hof mit drei Koffern: Kleidung, Gastgeschenke und Orden für den Fall, dass jemand nach Qualifikationen fragt. Beim ersten Empfang erklärt er dem Zeremonienmeister, ein Schützenmarsch brauche selbstverständlich einen kräftigen Auftakt. Das Orchester spielt daraufhin so entschlossen, dass zwei Hofräte versehentlich Haltung annehmen.\n\nPrinzessin Shirin lacht als Erste. Sie ist politisch hellwach und von den üblichen Heiratsbewerbern ungefähr so begeistert wie der Graf von alkoholfreiem Bier. Höhne hört ihr zu, anstatt ihre Herkunft in einem Stammbaum nachzuschlagen. Ein Spaziergang durch den Palastgarten dauert bis weit nach Ende des offiziellen Empfangs. Der mitgereiste Protokollführer notiert: 'Beziehungen entwickeln sich außerordentlich günstig. Gemeint sind vermutlich auch die diplomatischen.'"
 wfl_iran_succession.2.a:0 "Die Gesandtschaft beantragt einen zweiten Spaziergang."
 wfl_iran_succession.3.t:0 "Zwei Herzen und ein sehr langer Vertrag"
 wfl_iran_succession.3.d:0 "Aus Spaziergängen werden Abende voller Geschichten, aus den Geschichten eine Romanze. Shirin gesteht, dass sie Höhnes hoffnungslos überladenen Ordenskoffer charmant findet. Er erwidert, ihr Lächeln habe sämtliche diplomatischen Verteidigungslinien umgangen. Beide entscheiden sich aus freien Stücken für die Hochzeit.\n\nNur die verstaubte Erbfolgeordnung des Palastes macht Schwierigkeiten: Nach Ansicht der zerknitterten Hofjuristen darf ausschließlich ein Mann regieren. Shirin liest die Regel, legt sie mit einem demonstrativen Seufzer beiseite und setzt ihren Gemahl als neuen Schah durch. 'Du bekommst die Krone', sagt sie, 'wir besprechen die Regierung beim Frühstück.' Aus Flüren treffen Glückwünsche und ein Treuevertrag ein, dessen Anlage A die korrekte Lagerung der Hochzeitsgetränke regelt."
 wfl_iran_succession.3.a:0 "Der Graf übernimmt die Trauzeugenpauschale."
 wfl_iran_succession.4.t:0 "Lang lebe Al Höhne!"
 wfl_iran_succession.4.d:0 "Der neue Schah tritt mit goldenen Schulterstücken, einer Zigarre und dem bemerkenswert selbstsicheren Namen Al Höhne vor den Hof. Die Krone sitzt; der Treuevertrag mit Wesel-Flüren ebenfalls. Unter seiner Unterschrift steht handschriftlich: 'Dem Grafen treu, auch außerhalb der Öffnungszeiten.'\n\nDer Hofkanzler verliest die neue Ordnung: Der Iran steht fortan als Marionettenstaat unter dem Schutz des Grafen. Ein empörter Hofrat fragt, ob diese Klausel schon in der Verlobungsanzeige gestanden habe. Shirin verweist auf die Fußnote hinter 'für immer verbunden' und lässt den Hochzeitsempfang eröffnen. Al Höhne erhebt sein Glas auf seine Gemahlin, seine neue Heimat und den alten Verein. Aus Flüren kommt ein Telegramm: 'Diplomatischer Erfolg anerkannt. Bitte Pfand vollständig zurückführen.' Der Protokollführer streicht auf seiner Reisekostenabrechnung 'Rückfahrt' und schreibt stattdessen 'Thronbezug'."
 wfl_iran_succession.4.a:0 "Ein Hoch auf den Schah und seine erstaunliche Dienstreise!"
