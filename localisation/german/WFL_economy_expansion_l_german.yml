l_german:
 WFL_berufskolleg_idee:0 "Das Berufskolleg Wesel"
 WFL_berufskolleg_idee_desc:0 "Die Verbindung von Ausbildung und Forschung erhöht unsere allgemeine Forschungsgeschwindigkeit dauerhaft um 5 Prozent."
 WFL_berufskolleg_industriebonus:0 "Industrieforschung des Berufskollegs"
 WFL_rheinblockade:0 "Rheinblockade"
 WFL_rheinblockade_desc:0 "Ein paar besoffene Schützen haben mit Vereinsbooten, einer Leine und einer äußerst selbstbewussten Gebührenordnung den Rhein blockiert. Deutschland und die Niederlande sollen Durchfahrtsgebühren zahlen. Unabhängig von ihren Antworten profitieren unsere Werften und Werkstätten: Zivil- und Militärfabriken werden dauerhaft je weitere 10 Prozent schneller gebaut. Die anschließenden Ereignisse bringen zusätzliche Einnahmen, notfalls durch die Versteigerung der beschlagnahmten Leergutbestände."
 WFL_alkoholfreies_bier_verbieten:0 "Alkoholfreies Bier verbieten"
 WFL_alkoholfreies_bier_verbieten_desc:0 "Der Getränkeausschuss erklärt die alkoholfreie Variante zum unzulässigen Täuschungsmanöver. Die Truppe reagiert mit überraschendem Tatendrang. Die Armeemoral, also die Erholung der Organisation, steigt dauerhaft um 10 Prozent."
 WFL_alkoholfreies_bier_verbot_idee:0 "Kein alkoholfreies Bier in der Kantine"
 WFL_alkoholfreies_bier_verbot_idee_desc:0 "Das neue Kantinengesetz steigert die Armeemoral und damit die Erholung der Organisation um 10 Prozent."
 WFL_flachglas_ruestungsproduktion:0 "Flachglas zur Rüstungsproduktion umbauen"
 WFL_flachglas_ruestungsproduktion_desc:0 "Die Werkshallen bekommen eine neue Aufgabe. Aus Glasfertigung wird Rüstungsproduktion: In unserem vollständig kontrollierten Flüren entstehen sofort drei Militärfabriken samt drei zusätzlichen Bauplätzen. Geht der Standort verloren, wird er entmilitarisiert oder reichen die maximalen Gebäudegrenzen nicht aus, erhalten wir stattdessen 150 politische Macht."
 WFL_schuetzen_kriegswirtschaft:0 "Alles für die Schützenwirtschaft"
 WFL_schuetzen_kriegswirtschaft_desc:0 "Nach dem Umbau der Flachglaswerke bündelt die Regierung Rohstoffe, Aufträge und Arbeitskräfte. Dieser Fokus führt unmittelbar und ohne politische Machtkosten das Wirtschaftsgesetz Kriegswirtschaft ein. Haben wir bereits Kriegswirtschaft oder totale Mobilmachung, erhalten wir stattdessen 100 politische Macht."
 WFL_anglo_bier_diplomatie:0 "Anglo Bier Diplomatie"
 WFL_anglo_bier_diplomatie_desc:0 "Eine Delegation bringt Pils, Schützenhut und einen ungewöhnlich langen Trinkspruch nach Großbritannien. Zwischen warmem Ale, kaltem Pils und einer diplomatisch hochsensiblen Portion Fisch entwickelt sich eine Freundschaft: Die Ereigniskette verbessert die gegenseitige Meinung um 100 und die Handelsmeinung um 50. Bei Krieg oder verschwundenem Partner bleibt eine politische Ersatzbelohnung."
