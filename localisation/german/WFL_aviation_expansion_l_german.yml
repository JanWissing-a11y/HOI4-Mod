l_german:
 WFL_roemerwardt_ausbauen:0 "Den Römerwardt ausbauen"
 WFL_roemerwardt_ausbauen_desc:0 "Auf Römerwardt wird aus der beschaulichen Startbahn das Tor zum Flürener Himmel. Bei Abschluss wird der Flugplatz sofort auf Stufe 5 ausgebaut. Ein bereits größerer Flugplatz bleibt erhalten. Voraussetzung ist, dass Wesel-Flüren den Standort weiterhin besitzt und vollständig kontrolliert, nicht kapituliert hat und der Standort nicht entmilitarisiert ist. Ist eine dieser Voraussetzungen beim Abschluss nicht mehr erfüllt, erhalten wir stattdessen 50 politische Macht. Die ersten gemeinsamen Flugübungen bringen in jedem Fall 10 Luftwaffenerfahrung. Der Platzwart bittet lediglich darum, die Schützenhüte vor dem Start ordentlich festzuhalten."
 WFL_roemerwardt_flugschule:0 "Die Flugschule Römerwardt"
 WFL_roemerwardt_flugschule_desc:0 "Unsere Fluglehrer erklären geduldig, dass eine Platzrunde weder eine Getränkebestellung noch eine Ehrenrunde um die Bürgerhalle ist. Ein einheitlicher Lehrplan, feste Übungszeiten und sorgfältige Nachbesprechungen schaffen eine leistungsfähige Pilotenschule. Wir erhalten 35 Luftwaffenerfahrung und dauerhaft 20 Prozent mehr Erfahrung für Luftgeschwader während der Ausbildung."
 WFL_roemerwardt_luftfahrtwerkstaetten:0 "Luftfahrtwerkstätten an der Startbahn"
 WFL_roemerwardt_luftfahrtwerkstaetten_desc:0 "Die Flürener Tüftler beziehen Werkstätten direkt am Flugplatz. Wer bislang das Vereinsauto repariert hat, führt nun gewissenhaft Wartungsbücher für Motoren und Tragflächen. Der Werkstattleiter stellt klar: Eine Schleife am Propeller gilt nicht als aerodynamische Verbesserung. Wir erhalten 25 Luftwaffenerfahrung, dauerhaft 20 Prozent weniger Flugunfälle und 10 Prozent mehr Flugzeugreichweite."
 WFL_roemerwardt_luftwaffenakademie:0 "Die Luftwaffenakademie Römerwardt"
 WFL_roemerwardt_luftwaffenakademie_desc:0 "Fluglehrer, Techniker und Einsatzplaner werden an einer gemeinsamen Akademie ausgebildet. Bei den Kartenübungen kommt das Vereinslokal nur noch als Orientierungspunkt vor; Wetterberichte, Funkdisziplin und abgestimmte Einsatzpläne bestimmen den Unterricht. Der Abschluss bringt 50 Luftwaffenerfahrung und dauerhaft 10 Prozent zusätzliche Luftmissionseffizienz."
 WFL_roemerwardt_flugschule_idee:0 "Flugschule Römerwardt"
 WFL_roemerwardt_flugschule_idee_desc:0 "Ein geregelter Ausbildungsbetrieb verbessert den Erfahrungsgewinn der Luftgeschwader bei Übungen um 20 Prozent."
 WFL_roemerwardt_luftfahrtwerkstaetten_idee:0 "Luftfahrtwerkstätten Römerwardt"
 WFL_roemerwardt_luftfahrtwerkstaetten_idee_desc:0 "Sorgfältige Wartung und technische Verbesserungen verringern Flugunfälle um 20 Prozent und erhöhen die Flugzeugreichweite um 10 Prozent."
 WFL_roemerwardt_luftwaffenakademie_idee:0 "Luftwaffenakademie Römerwardt"
 WFL_roemerwardt_luftwaffenakademie_idee_desc:0 "Gemeinsame Ausbildung für Besatzungen, Bodenpersonal und Einsatzstäbe steigert die Luftmissionseffizienz um 10 Prozent."
