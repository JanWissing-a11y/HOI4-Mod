l_german:
 WFL_rheinblockade_idee:0 "Die produktivste Rheinblockade aller Zeiten"
 WFL_rheinblockade_idee_desc:0 "Aus einer schwankenden Zollstation wird ein florierender Umschlagplatz. Der Bau von Zivil- und Militärfabriken steigt dauerhaft um jeweils 10 Prozent. Diese Förderung bleibt unabhängig von ausländischen Antworten bestehen."
 WFL_rheinischer_festbeitrag:0 "Ein rheinischer Festbeitrag"
 WFL_rheinischer_protest:0 "Ärger über die Schützen-Zollstation"
 WFL_anglo_bierfreundschaft:0 "Die anglo-flürener Bierfreundschaft"
 WFL_anglo_bierhandel:0 "Pils, Ale und freie Zapfhähne"
 wfl_beer.1.t:0 "Schützenhutpflicht auf dem Rhein"
 wfl_beer.1.d:0 "Nach einem ausgesprochen gründlichen Vereinsabend errichten Flürener Schützen am Rhein eine Zollstation aus Klappstühlen, einer Wäscheleine und einem sehr amtlich aussehenden Bierdeckel. Auf dem Schild steht: Durchfahrt nur mit Festbeitrag. Als das erste Schiff vorbeifährt, grüßt der Kapitän freundlich und fährt unter der Wäscheleine hindurch.\n\nDie Schützen erklären dies zu einem diplomatischen Zwischenfall. Die Verwaltung von [WFL.GetLeader] erkennt dagegen eine Geschäftsidee: Ein ordentlicher Verladeplatz mit Verkauf, Werkstätten und Festwirtschaft bringt erheblich mehr ein als eine Wäscheleine. Deutschland und die Niederlande erhalten trotzdem eine höflich formulierte Beitragsrechnung.\n\nDie Wirtschaftsförderung gilt dauerhaft. Jede der beiden Antworten bringt uns einmalig 50 politische Macht: bei Zustimmung als Erfolg, bei Ablehnung durch den Verkauf der inzwischen begehrten Protest-Bierdeckel. Bleibt eine Antwort aus, wird der Erlös nach 30 Tagen abgerechnet."
 wfl_beer.1.a:0 "Rechnungen verschicken. Die Wäscheleine vorläufig einholen."
 wfl_beer.2.t:0 "Eine Rechnung mit Hopfensiegel aus Flüren"
 wfl_beer.2.d:0 "Auf dem Schreibtisch von [GER.GetLeader] liegt ein Bierdeckel mit einem Flürener Schützenhut und der Forderung nach einem rheinischen Festbeitrag. Der Text verspricht bevorzugte Sitzplätze, freie Sicht auf den Fluss und die feierliche Beseitigung einer Wäscheleine.\n\nUnsere Beamten bestätigen: Die Schifffahrt läuft längst normal. Wir können den Beitrag als symbolische Geste bezahlen oder die Rechnung entschieden zurückweisen. Bezahlen kostet nur bei weiterhin friedlichen Beziehungen und mehr als 25 verfügbarer politischer Macht tatsächlich 25 politische Macht. Flürens Wirtschaftsförderung hängt von dieser Antwort nicht ab."
 wfl_beer.2.a:0 "25 politische Macht für Ruhe am Rhein und bessere Beziehungen."
 wfl_beer.2.b:0 "Wir bezahlen keine Klappstuhlzölle!"
 wfl_beer.3.t:0 "Die niederländische Antwort auf die Wäscheleine"
 wfl_beer.3.d:0 "[HOL.GetLeader] erhält eine überraschende Nachricht aus Flüren: Eine Schützendelegation verlangt einen Festbeitrag für den Rhein und legt einen Gutschein für Kartoffelsalat bei. Die Hafenverwaltung stellt fest, dass kein Schiff aufgehalten wurde. Ein Sachbearbeiter fragt trotzdem, ob der Gutschein übertragbar sei.\n\nWir können mit einem symbolischen Beitrag die guten Beziehungen pflegen oder den Anspruch zurückweisen. Eine Zahlung kostet nur bei weiterhin friedlichen Beziehungen und mehr als 25 verfügbarer politischer Macht tatsächlich 25 politische Macht. Den Kartoffelsalat hat der Sachbearbeiter vorsorglich schon in die Reisekostenabrechnung aufgenommen."
 wfl_beer.3.a:0 "25 politische Macht für gute Nachbarschaft. Den Gutschein aufheben."
 wfl_beer.3.b:0 "Der Rhein ist kein Festzeltparkplatz."
 wfl_beer.4.t:0 "Eine Kühltruhe auf großer diplomatischer Fahrt"
 wfl_beer.4.d:0 "Die Flürener Delegation reist zu [ENG.GetLeader]. Im Gepäck liegen Schützenhüte, ein Fass Pils und ein Kühlsystem, dessen Transportrechnung selbst die Finanzverwaltung beeindruckt. Der Auftrag von [WFL.GetLeader] ist eindeutig: Freundschaft schließen und klären, warum britisches Bier manchmal wärmer ist als das Flürener Freibad.\n\nDas britische Protokoll antwortet mit einer Einladung zum gemeinsamen Ale-Abend. Flüren bestätigt und fragt vorsichtig nach einer Steckdose. Die bevorstehende Freundschaft soll dauerhaft +100 gegenseitige Meinung sowie +50 gegenseitige Handelsmeinung schaffen. Fallen die Voraussetzungen vor dem Abschluss weg oder bleibt die Antwort 30 Tage aus, werden die Reisekosten mit einmalig 50 politischer Macht ausgeglichen."
 wfl_beer.4.a:0 "Über den Kanal! Und niemand stellt das Fass neben die Heizung."
 wfl_beer.5.t:0 "Pils, Ale und die Frage der richtigen Temperatur"
 wfl_beer.5.d:0 "[ENG.GetLeader] empfängt die Delegation aus Flüren. Zunächst verläuft das Treffen förmlich. Dann erklärt ein Flürener Schütze, das Ale sei ausgezeichnet, sofern man es als Suppe betrachte. Die Übersetzung verschluckt sich. Zum Glück lacht das britische Staatsoberhaupt zuerst.\n\nBeim anschließenden Essen retten Fish and Chips den Weltfrieden. Die Briten bewundern den Schützenhut, die Flürener entdecken die Vorzüge eines Pubs, und beide Seiten einigen sich auf die bahnbrechende Formel: Jedes Bier hat ein Recht auf seine eigene Temperatur. Der neue Freundschaftsvertrag passt diesmal auf einen richtigen Bogen Papier.\n\nWenn beide Länder noch existieren, nicht kapituliert haben und miteinander im Frieden sind, erhalten beide dauerhaft +100 Meinung und +50 Handelsmeinung. Flüren gewinnt zusätzlich 75 politische Macht. Andernfalls gibt es für Flüren einmalig 50 politische Macht zur Abwicklung."
 wfl_beer.5.a:0 "Auf die Freundschaft! Das Thermometer bleibt freiwillig."
 wfl_beer.6.t:0 "Ein Schützenhut im britischen Pub"
 wfl_beer.6.d:0 "Die Bierdiplomatie ist geglückt. Mit [ENG.GetLeader] wurden dauerhafte freundschaftliche Beziehungen und bevorzugte Handelskontakte vereinbart. In Flüren wird ein Ale-Fass feierlich neben das Pils gestellt. Auf ausdrücklichen Wunsch des Protokolls bekommt jedes Fass ein eigenes Thermometer.\n\nDie Delegation kehrt mit Fish-and-Chips-Rezepten, einer Einladung zum Gegenbesuch und einer erstaunlich gut erhaltenen Kühltruhe zurück. Die gegenseitige Meinung steigt um 100, die Handelsmeinung um 50. Das Abkommen verleiht keinen Bündnisbeitritt und keine gegenseitige Kriegspflicht."
 wfl_beer.6.fallback:0 "Die diplomatischen Voraussetzungen haben sich geändert oder die britische Antwort blieb aus. Die Delegation kehrt deshalb ohne Freundschaftsabkommen zurück. Die Kühltruhe funktioniert immerhin noch, und die Abwicklung bringt einmalig 50 politische Macht. Die Schützen erklären, sie hätten demnächst ohnehin lieber den heimischen Zapfhahn kontrolliert."
 wfl_beer.6.a:0 "Die Kühltruhe erhält einen Ehrenplatz."
