l_german:
 WFL_royal_recruitment_festivals:0 "Jans Feste ohne Grenzen"
 WFL_royal_recruitment_festivals_desc:0 "Jan Graf von Insel I. wirbt mit Musik, Gastfreundschaft und Kartoffelsalat um freiwillige Rekruten. Vier einmalige Vorbereitungen verleihen jeweils dauerhaft +5 Prozentpunkte beim nutzbaren Anteil der rekrutierbaren Nicht-Kern-Mannstärke; zusammen höchstens +20 Prozentpunkte. Voraussetzung: Jan regiert und WFL besitzt oder kontrolliert mindestens ein Nicht-Kerngebiet. Bei Verlust dieser Voraussetzungen wird eine laufende Vorbereitung ohne Bonus abgebrochen."
 WFL_koenigliche_freibieroffensive:0 "Die königliche Freibieroffensive"
 WFL_koenigliche_freibieroffensive_desc:0 "Jan lässt die Zapfhähne und die Blaskapelle anrollen. Am Rekrutierungstisch liegt ein freiwilliger Aufnahmeantrag; unterschrieben wird erst am nächsten Morgen. Einmalig: 50 politische Macht und 30 Tage Vorbereitung, danach dauerhaft +5 Prozentpunkte Nicht-Kern-Mannstärke."
 WFL_kartoffelsalat_ohne_grenzen:0 "Kartoffelsalat ohne Grenzen"
 WFL_kartoffelsalat_ohne_grenzen_desc:0 "Wer nach Jans Fest noch am Vereinsbeitritt zweifelt, wird zum internationalen Kartoffelsalatvergleich eingeladen. Die Freundschaften wachsen, die freiwilligen Anmeldungen auch. Nach der Freibieroffensive: einmalig 75 politische Macht und 45 Tage Vorbereitung für weitere dauerhafte +5 Prozentpunkte Nicht-Kern-Mannstärke."
 WFL_blasmusik_statt_formulare:0 "Blasmusik statt Formularfrust"
 WFL_blasmusik_statt_formulare_desc:0 "Die Kapelle spielt auf, Dolmetscher erklären den freiwilligen Dienst und Jan beantwortet Fragen zwischen zwei Zugaben. Selbst der Papierstapel hat jetzt Taktgefühl. Nach dem Kartoffelsalatfest: einmalig 100 politische Macht und 60 Tage Vorbereitung für weitere dauerhafte +5 Prozentpunkte Nicht-Kern-Mannstärke."
 WFL_der_grosse_schuetzenpass:0 "Ein Kater für das Vaterland"
 WFL_der_grosse_schuetzenpass_desc:0 "Am nächsten Morgen serviert Jan das größte Katerfrühstück am Niederrhein. Zwischen Rollmops, Kaffee und erstaunlich schiefem Chorgesang gründen die Gäste neue Schützenvereine. Auf dem Heimweg melden sich immer mehr bei der Armee: Das nächste Manöver soll schließlich genauso gute Verpflegung haben. Nach der Blasmusikrunde: einmalig 125 politische Macht und 90 Tage Vorbereitung für weitere dauerhafte +5 Prozentpunkte Nicht-Kern-Mannstärke."
 WFL_freibierfreiwillige:0 "Die Freibier-Freiwilligen"
 WFL_freibierfreiwillige_desc:0 "Die Nachbarn kennen Jan jetzt persönlich, und der freiwillige Dienst hat ein freundliches Gesicht. Zusätzlich 5 Prozentpunkte beim nutzbaren Anteil der rekrutierbaren Mannstärke aus Nicht-Kerngebieten."
 WFL_kartoffelsalat_kameraden:0 "Die Kartoffelsalat-Kameraden"
 WFL_kartoffelsalat_kameraden_desc:0 "Das Rezept bleibt umstritten, die neuen Freundschaften halten. Zusätzlich 5 Prozentpunkte beim nutzbaren Anteil der rekrutierbaren Mannstärke aus Nicht-Kerngebieten; addiert sich mit den anderen Festboni."
 WFL_blasmusik_bataillone:0 "Die Blasmusik-Bataillone"
 WFL_blasmusik_bataillone_desc:0 "Gemeinsame Lieder und verständliche Auskünfte überzeugen weitere Freiwillige. Zusätzlich 5 Prozentpunkte beim nutzbaren Anteil der rekrutierbaren Mannstärke aus Nicht-Kerngebieten; addiert sich mit den anderen Festboni."
 WFL_schuetzenpass_freiwillige:0 "Freiwillige mit Schützenpass"
 WFL_schuetzenpass_freiwillige_desc:0 "Aus Begegnungen ist ein verlässliches Netz freiwilliger Anwerbung geworden. Zusätzlich 5 Prozentpunkte beim nutzbaren Anteil der rekrutierbaren Mannstärke aus Nicht-Kerngebieten; alle vier Festboni ergeben zusammen +20 Prozentpunkte."
