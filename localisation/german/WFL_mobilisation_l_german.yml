 WFL_volk_unter_schuetzenhut:0 "Ein Volk unter dem Schützenhut"
 WFL_volk_unter_schuetzenhut_desc:0 "Vom Vereinsregister bis zum letzten Klappstuhl ist ganz Flüren für den Dienst organisiert. Dauerhaft +20 Prozentpunkte rekrutierbare Bevölkerung zusätzlich zum Wehrpflichtgesetz. Bei Freiwilligenarmee steigt die Quote dadurch von 1,5 % auf 21,5 %, bevor weitere Faktoren wirken. Neue Rekruten werden nach den normalen Regeln der Mobilisierung verfügbar; es handelt sich nicht um ein einmaliges Mannstärkegeschenk. Nicht-Kerngebiete behalten ihre eigenen Abzüge."
