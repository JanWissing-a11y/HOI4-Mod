l_german:
 WFL_brauereiverbund_idee:0 "Flürener Brauereiverbund"
 WFL_brauereiverbund_idee_desc:0 "Gemeinsame Werkstätten, Flaschen und Lieferpläne beschleunigen den Bau von Zivilfabriken um 10 Prozent. Der Kassenwart führt Pfand inzwischen als eigene Maßeinheit."
 WFL_festlogistik_idee:0 "Nachschub nach Festzeltordnung"
 WFL_festlogistik_idee_desc:0 "Wer gleichzeitig Blaskapelle, Kartoffelsalat und hundert Klappstühle befördern kann, organisiert auch den militärischen Nachschub. Der Versorgungsverbrauch sinkt um 8 Prozent."
 WFL_vereinsdiplomatie_idee:0 "Diplomatie mit Ehrenschleife"
 WFL_vereinsdiplomatie_idee_desc:0 "Gute Beziehungen beginnen mit einer Einladung und enden gelegentlich erst nach dem letzten Marsch. Die laufenden Kosten für die Verbesserung diplomatischer Beziehungen sinken um 15 Prozent."
 WFL_schuetzenakademie_idee:0 "Die Flürener Schützenakademie"
 WFL_schuetzenakademie_idee_desc:0 "Gemeinsame Ausbildung und verbindliche Kommandos erhöhen die Organisation des Heeres um 5 Prozent. Das Kommando zum Antreten gilt ausdrücklich auch vor dem Buffet."
 WFL_rheinischer_forschungsbund_idee:0 "Rheinischer Forschungsbund"
 WFL_rheinischer_forschungsbund_idee_desc:0 "Berufskolleg und Labore teilen ihre Ergebnisse. Die allgemeine Forschungsgeschwindigkeit steigt um 5 Prozent. Fachbegriffe müssen weiterhin auf einen Bierdeckel passen."
 WFL_festkasse_idee:0 "Die unbestechliche Festkasse"
 WFL_festkasse_idee_desc:0 "Eine dauerhafte Festkasse schafft Planungssicherheit: täglich +0,05 politische Macht und +2 Prozentpunkte Stabilität. Nur die verschwundene Pfandmarke bleibt ein Staatsgeheimnis."
 WFL_vereinsnachwuchs_idee:0 "Nachwuchs vom Schießstand"
 WFL_vereinsnachwuchs_idee_desc:0 "Die Schützenolympiade schafft dauerhafte Ausbildungsvereine. Rekrutierbare Bevölkerung +0,5 Prozentpunkte, Ausbildungszeit des Heeres -5 Prozent."
 WFL_vereinsverstaendigung_idee:0 "Verständigung unter Schützenhüten"
 WFL_vereinsverstaendigung_idee_desc:0 "Der Weltkongress setzt auf friedlichen Austausch: Stabilität +10 Prozentpunkte, Kriegsunterstützung -5 Prozentpunkte. Streitfälle werden zunächst am Kuchenbuffet verhandelt."
 WFL_weltweiter_vereinsnachwuchs_idee:0 "Ein Verein auf jedem Kontinent"
 WFL_weltweiter_vereinsnachwuchs_idee_desc:0 "Internationale Vereine begeistern neue Freiwillige: rekrutierbare Bevölkerung +1 Prozentpunkt und Nichtkern-Mannstärke +5 Prozentpunkte."
 WFL_community_industrieforschung:0 "Tüftlermesse am Auesee"
 wfl_community.1.t:0 "Der größte Bierdeckel der Staatsgeschichte"
 wfl_community.1.d:0 "Zur Gründung des Brauereiverbunds lässt Jan Graf von Insel I. eine Festtafel aufbauen. Der Tischler versteht das Wort Tafel als Größenangabe und liefert einen Bierdeckel für zwölf Personen. Der Kassenwart entdeckt darin unverhofft Platz für eine vollständige Jahresbilanz.\n\nWährend die Kapelle zum dritten Mal die Begrüßung spielt, streiten zwei Ausschüsse um den Überschuss: Soll er sofort in ein großes Bürgerfest fließen oder als dauerhafte Festkasse erhalten bleiben? Jan lehnt die dritte Idee ab, sämtliche Einnahmen in einen vergoldeten Flaschenöffner zu investieren. Der wäre im Haushaltsausschuss nur schwer zu erklären.\n\nRegiert Jan bei der Entscheidung nicht mehr, werden die Planungen geordnet abgeschlossen und beide Möglichkeiten gewähren stattdessen 50 politische Macht."
 wfl_community.1.a:0 "Heute feiert ganz Flüren!"
 wfl_community.1.b:0 "Die Festkasse bekommt ein Schloss."
 wfl_community.2.t:0 "Die ersten Flürener Schützenolympischen Spiele"
 wfl_community.2.d:0 "Jan eröffnet die Schützenolympiade mit einer Ansprache über Ausdauer, Präzision und die unantastbare Warteschlange am Grill. Das Programm umfasst Zielschießen, Hindernislauf und den Transport eines Klappstuhls bei Gegenwind. Beim letzten Wettbewerb meldet die Königsgarde erhebliche taktische Schwierigkeiten.\n\nAm Abend hängen mehr Medaillen an der Ehrentribüne als an den Teilnehmern. Der Ausbildungsstab möchte die gewonnenen Erfahrungen sofort auswerten. Die Vereine schlagen stattdessen vor, das Gelände dauerhaft für die Ausbildung neuer Freiwilliger zu nutzen. Der Klappstuhl erhält vorerst einen eigenen Spind.\n\nFalls Jan inzwischen nicht mehr regiert, wird das sportliche Ergebnis archiviert und die gewählte Möglichkeit gewährt stattdessen 50 politische Macht."
 wfl_community.2.a:0 "Den Klappstuhl als Lehrstück behalten."
 wfl_community.2.b:0 "Platz für den Vereinsnachwuchs!"
 wfl_community.4.t:0 "Tag der offenen Labortür: Bitte nicht am Reaktor klopfen"
 wfl_community.4.d:0 "Die Forschenden am Auesee laden zur Tüftlermesse. Ein Team präsentiert eine automatische Pfandrückgabe, ein zweites einen Kartoffelschäler mit viel zu vielen Schaltern. Hinter einer abgesperrten Tür hängt ein Schild: Hier wird geforscht. Bitte nicht testen, ob es leuchtet.\n\nEine Lehrerin erklärt die Apparate so verständlich, dass der Kassenwart erstmals freiwillig eine Formel abschreibt. Nun können wir die Werkstätten auf ein industrielles Forschungsvorhaben konzentrieren oder mit einer öffentlichen Ausstellung um breitere Unterstützung werben. Die Labortür bleibt in beiden Fällen offen. Die andere Tür bleibt in beiden Fällen zu."
 wfl_community.4.a:0 "Die Werkstätten tüfteln weiter."
 wfl_community.4.b:0 "Wissenschaft zum Anfassen!"
 wfl_community.5.t:0 "Der Weltkongress des Schützenwesens"
 wfl_community.5.d:0 "Delegationen aus aller Welt erreichen Flüren. Die Übersetzungsabteilung scheitert bereits am Begriff Königskettenträgerstellvertreter. Jan kürzt ihn für das internationale Protokoll auf den Mann mit der anderen Kette. Daraufhin verläuft die Eröffnung erstaunlich reibungslos.\n\nNach drei Tagen gibt es zwei Beschlussvorlagen. Die erste erklärt gemeinsame Feste, Austausch und friedliche Verständigung zum obersten Vereinszweck. Die zweite gründet ein internationales Netz von Ausbildungsvereinen für Freiwillige. Beide verlangen ein Abschlussfoto. Nur über die Zahl der mitzuführenden Fahnen wird bis spät in die Nacht verhandelt.\n\nSollte Jan vor dem Beschluss aus dem Amt scheiden, endet der Kongress mit einem neutralen Abschlussbericht. Die gewählte Möglichkeit gewährt dann stattdessen 50 politische Macht."
 wfl_community.5.a:0 "Verständigung beginnt am Kuchenbuffet."
 wfl_community.5.b:0 "Ein Verein auf jedem Kontinent!"
