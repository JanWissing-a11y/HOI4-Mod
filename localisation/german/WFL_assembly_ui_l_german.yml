 WFL_board_ui_nils_meyer_name:0 "Nils Meyer"
 WFL_board_ui_nils_meyer_role:0 "§YIndustrie§!"
 WFL_board_ui_nils_meyer_tooltip:0 "§YNils Meyer · Industrie§!\nNils hält jede Wortmeldung per Smartphone fest. Sein Vorschlag: erst die Produktionszahlen verdoppeln, dann das Gruppenfoto machen.\n\nMöglicher Beschluss: §G+15%§! Fabrik- und Werftleistung.\nNächste Versammlung: [WFLBoardNilsMeyerStatus]\nLetzter Beschluss: [WFLBoardNilsMeyerLastResult]\n\nEinflussnahme über die Entscheidung unten: 35 politische Macht, einmal pro Mitglied und Versammlung. 85% reine Zusage, 10% Zusage mit Verärgerung eines anderen Mitglieds, 5% Verärgerung dieses Mitglieds. Ein gemeinsamer Eklat kann dennoch Beschlüsse verhindern."
 WFL_board_ui_jannik_altenschmidt_name:0 "Jannik Altenschmidt"
 WFL_board_ui_jannik_altenschmidt_role:0 "§YBauwesen§!"
 WFL_board_ui_jannik_altenschmidt_tooltip:0 "§YJannik Altenschmidt · Bauwesen§!\nJannik erklärt die Bauplanung am Bierdeckel. Wenn die neue Werkhalle nicht auf den Tisch passt, bestellt er einfach einen größeren Tisch.\n\nMöglicher Beschluss: §G+15%§! Baugeschwindigkeit für Zivil- und Militärfabriken.\nNächste Versammlung: [WFLBoardJannikAltenschmidtStatus]\nLetzter Beschluss: [WFLBoardJannikAltenschmidtLastResult]\n\nEinflussnahme über die Entscheidung unten: 35 politische Macht, einmal pro Mitglied und Versammlung. 85% reine Zusage, 10% Zusage mit Verärgerung eines anderen Mitglieds, 5% Verärgerung dieses Mitglieds. Ein gemeinsamer Eklat kann dennoch Beschlüsse verhindern."
 WFL_board_ui_tobias_gaertner_name:0 "Tobias Gärtner"
 WFL_board_ui_tobias_gaertner_role:0 "§YHeer§!"
 WFL_board_ui_tobias_gaertner_tooltip:0 "§YTobias Gärtner · Heer§!\nTobias zählt beim Antreten sogar die Stuhlreihen. Sein Gefechtsplan beginnt mit einer geordneten Tagesordnung und endet bei einem sehr unordentlichen Gegner.\n\nMöglicher Beschluss: §G+5%§! Heeresangriff, Verteidigung und Organisation.\nNächste Versammlung: [WFLBoardTobiasGaertnerStatus]\nLetzter Beschluss: [WFLBoardTobiasGaertnerLastResult]\n\nEinflussnahme über die Entscheidung unten: 35 politische Macht, einmal pro Mitglied und Versammlung. 85% reine Zusage, 10% Zusage mit Verärgerung eines anderen Mitglieds, 5% Verärgerung dieses Mitglieds. Ein gemeinsamer Eklat kann dennoch Beschlüsse verhindern."
 WFL_board_ui_finn_bielig_name:0 "Finn Bielig"
 WFL_board_ui_finn_bielig_role:0 "§YVersorgung§!"
 WFL_board_ui_finn_bielig_tooltip:0 "§YFinn Bielig · Versorgung§!\nFinn führt die Bratwurstreserve persönlich. Solange die Grillzange nicht abhandenkommt, erreicht jeder Nachschubwagen pünktlich seine Kompanie.\n\nMöglicher Beschluss: §G-10%§! Nachschubverbrauch und Heeresausbildungszeit.\nNächste Versammlung: [WFLBoardFinnBieligStatus]\nLetzter Beschluss: [WFLBoardFinnBieligLastResult]\n\nEinflussnahme über die Entscheidung unten: 35 politische Macht, einmal pro Mitglied und Versammlung. 85% reine Zusage, 10% Zusage mit Verärgerung eines anderen Mitglieds, 5% Verärgerung dieses Mitglieds. Ein gemeinsamer Eklat kann dennoch Beschlüsse verhindern."
 WFL_board_ui_max_gerwers_name:0 "Max Gerwers"
 WFL_board_ui_max_gerwers_role:0 "§YForschung§!"
 WFL_board_ui_max_gerwers_tooltip:0 "§YMax Gerwers · Forschung§!\nMax zerlegt den Diaprojektor, um die Sitzung zu beschleunigen. Er baut ihn als effizientere Maschine wieder zusammen; die Folien gelten seitdem als Forschungsgeheimnis.\n\nMöglicher Beschluss: §G+5%§! Forschungsgeschwindigkeit und §G+10%§! Produktionseffizienz-Zuwachs.\nNächste Versammlung: [WFLBoardMaxGerwersStatus]\nLetzter Beschluss: [WFLBoardMaxGerwersLastResult]\n\nEinflussnahme über die Entscheidung unten: 35 politische Macht, einmal pro Mitglied und Versammlung. 85% reine Zusage, 10% Zusage mit Verärgerung eines anderen Mitglieds, 5% Verärgerung dieses Mitglieds. Ein gemeinsamer Eklat kann dennoch Beschlüsse verhindern."
 WFL_board_ui_tim_wissing_name:0 "Tim Wissing"
 WFL_board_ui_tim_wissing_role:0 "§YZusammenhalt§!"
 WFL_board_ui_tim_wissing_tooltip:0 "§YTim Wissing · Zusammenhalt§!\nTim findet selbst im Kassenbericht noch einen Grund zum Anstoßen. Wenn zwei Schützen streiten, beantragt er eine Aussprache am Tresen.\n\nMöglicher Beschluss: täglich §G+0,15§! politische Macht und §G+5 Prozentpunkte§! Stabilität.\nNächste Versammlung: [WFLBoardTimWissingStatus]\nLetzter Beschluss: [WFLBoardTimWissingLastResult]\n\nEinflussnahme über die Entscheidung unten: 35 politische Macht, einmal pro Mitglied und Versammlung. 85% reine Zusage, 10% Zusage mit Verärgerung eines anderen Mitglieds, 5% Verärgerung dieses Mitglieds. Ein gemeinsamer Eklat kann dennoch Beschlüsse verhindern."


