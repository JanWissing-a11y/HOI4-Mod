 WFL_board_ui_mood_hostile:0 "§RZerstritten · -10 Pp. Stabilität§!"
 WFL_board_ui_mood_tooltip:0 "§YAllgemeine Stimmung im Vorstand§!\n[?WFL_board_mood|0]/100 · [WFLBoardMoodLabel]\n\n[WFLBoardInfluenceMoodRules] Eine Blockade senkt die Stimmung um 10, ein Eklat um 20.\n\nMonatlich: Eklat -5; sonst Blockade -3; sonst bei weniger als 40 Punkten -2; andernfalls +2. Die Abzüge werden nicht miteinander addiert.\n\nUnter 40 Punkten: -5 Prozentpunkte Stabilität. Unter 20: -10 Prozentpunkte statt -5. Der Malus entfällt nach ausreichender Erholung.\n\nEntscheidungen unten verbessern die Stimmung. Die allgemeine Stimmung und die persönliche Verärgerung einzelner Mitglieder sind getrennt."
