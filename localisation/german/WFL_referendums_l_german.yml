l_german:
 WFL_schuetzenreferenden:0 "Die Genialität des Schützenwesens"
 WFL_schuetzenreferenden_desc:0 "Unsere Schützenfeste werben friedlich für die Gemeinschaft von Flüren. Die einmalige 90-tägige Kampagne kostet 75 politische Macht. Danach sind bis zu zwei Referendumsanträge für jeweils 100 politische Macht möglich: ein zweiter erst nach Ablehnung oder Abbruch des ersten. Bei normalen Beziehungen lässt die KI 25 % der Anträge zu; danach beträgt die Ja-Chance 60 %. Gute Beziehungen und demokratische Regierungen erhöhen die Chancen. Nur ein gültiges Ja überträgt das Gebiet und vergibt einen Kern. Kosten werden nicht erstattet."
 WFL_schuetzenkampagne_51:0 "Schützenfest im Rheinland"
 WFL_schuetzenkampagne_51_desc:0 "Für 75 politische Macht werben unsere Flürener Schützen 90 Tage lang in Rheinland für Vereinskultur, Kameradschaft und die Genialität des Schützenwesens. Diese Werbekampagne ist einmalig. Nach erfolgreichem Abschluss stehen bis zu zwei bezahlte Referendumsanträge bereit. Frieden, souveräne Beteiligte und volle Eigentümerkontrolle sind erforderlich; Kosten werden nicht erstattet."
 WFL_referendum_beantragen_51:0 "Referendum beantragen: Rheinland"
 WFL_referendum_beantragen_51_desc:0 "Nach der Überzeugungskampagne beantragen wir für 100 politische Macht den ersten friedlichen Beitrittsentscheid für das Rheinland. Die Grundchance für KI-Zulassung beträgt 25 %, danach die Ja-Chance 60 %; gute Beziehungen erhöhen beides. Die Abstimmung folgt 30 Tage nach Zustimmung. Nur ein gültiges Ja überträgt das Gebiet und gibt WFL einen Kern. Nach Ablehnung oder Abbruch bleibt ein zweiter Antrag für weitere 100 politische Macht. Jedes unerledigte Verfahren verfällt nach 120 Tagen; Kosten bleiben verbraucht."
 wfl_referendum.1.t:0 "Flürener Schützen werben um Rheinland"
 wfl_referendum.1.d:0 "Die Gäste aus Flüren haben im Rheinland ihre Schützenfeste veranstaltet und nun ein friedliches Beitrittsreferendum beantragt. Wir können dieses Verfahren erlauben oder ohne Gebietsverlust ablehnen. Eine Zustimmung überträgt noch kein Land: Erst 30 Tage später folgt eine gesonderte Abstimmung, deren Ja-Ergebnis wir ausdrücklich anerkennen müssten."
 wfl_referendum.1.a:0 "Wir erlauben eine freie Abstimmung."
 wfl_referendum.1.b:0 "Wir lehnen das Verfahren ab."
 wfl_referendum.2.t:0 "Das Beitrittsreferendum im Rheinland"
 wfl_referendum.2.d:0 "Nach der Kampagne für die Genialität des Schützenwesens steht die Entscheidung über den Beitritt vom Rheinland zu Flüren an. Ein anerkanntes Ja überträgt das Gebiet und gibt WFL einen Kern. Ein Nein belässt das Gebiet bei uns. Nur bei unverändertem Eigentümer, vollständiger Kontrolle, Frieden und souveränen Beteiligten ist die Übergabe zulässig."
 wfl_referendum.2.a:0 "Die Mehrheit sagt Ja. Wir erkennen den Beitritt an."
 wfl_referendum.2.b:0 "Das Ergebnis lautet Nein. Das Gebiet bleibt."
 wfl_referendum.2.c:0 "Die Bedingungen gelten nicht mehr. Verfahren abbrechen."
 wfl_referendum.3.t:0 "Rheinland tritt Flüren bei"
 wfl_referendum.3.d:0 "Unsere Flürener Schützen haben die Menschen für ihre Gemeinschaft gewonnen. Nach genehmigtem Referendum wurde ein Ja-Ergebnis ausdrücklich anerkannt. Rheinland gehört jetzt zu Flüren und ist ein Kerngebiet. Bisherige Kernansprüche anderer Länder bestehen weiterhin."
 wfl_referendum.3.a:0 "Ein Hoch auf die Gemeinschaft!"
 wfl_referendum.4.t:0 "Kein Beitritt vom Rheinland"
 wfl_referendum.4.d:0 "Das Verfahren für das Rheinland endet ohne Beitritt: Der Eigentümer hat den Antrag abgelehnt oder die Abstimmung endete mit Nein. Weder Land noch WFL-Kernrechte werden vergeben. Nach dem ersten gescheiterten Antrag ist ein zweiter für weitere 100 politische Macht möglich. Nach dem zweiten ist diese Möglichkeit ausgeschöpft; die bisher bezahlten Kosten bleiben verbraucht."
 wfl_referendum.4.a:0 "Wir respektieren die Entscheidung."
 wfl_referendum.5.t:0 "Das Verfahren für das Rheinland ist beendet"
 wfl_referendum.5.d:0 "Die Bedingungen für unsere Kampagne oder unser Referendum für das Rheinland bestehen nicht mehr, oder ein Antrag wurde nicht innerhalb von 120 Tagen abgeschlossen. Es werden weder Land noch WFL-Kernrechte vergeben. Bei bereits abgeschlossener Werbekampagne bleibt nach dem ersten gescheiterten Antrag ein zweiter für weitere 100 politische Macht; nach dem zweiten ist Schluss. Kosten werden nicht erstattet."
 wfl_referendum.5.a:0 "Ohne gültige Zustimmung kein Beitritt."
 wfl_referendum.7.t:0 "Die Schützenkampagne im Rheinland ist abgeschlossen"
 wfl_referendum.7.d:0 "90 Tage lang haben die Flürener für die Genialität des Schützenwesens geworben. Für das Rheinland ist nun der erste Referendumsantrag für 100 politische Macht verfügbar. Nach Ablehnung oder Abbruch kann ein zweiter und letzter Antrag für weitere 100 politische Macht folgen, ohne neue Werbekampagne. Der Eigentümer muss das Gebiet vollständig kontrollieren; beide Länder müssen friedlich und souverän bleiben."
 wfl_referendum.7.a:0 "Jetzt können wir den Antrag stellen."
