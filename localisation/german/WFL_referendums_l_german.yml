 WFL_referendum_zweiter_versuch_51:0 "Zweiter Referendumsantrag: Rheinland"
 WFL_referendum_zweiter_versuch_51_desc:0 "Der erste Versuch für das Rheinland endete ohne Beitritt. Für weitere 100 politische Macht starten wir unseren zweiten und letzten Antrag; die abgeschlossene Werbekampagne muss nicht wiederholt werden. Es gelten dieselben verbesserten Chancen sowie Friedens-, Eigentums- und Kontrollbedingungen. Zustimmung führt nach 30 Tagen zur Abstimmung, nach 120 Tagen verfällt ein unerledigtes Verfahren. Kein dritter Versuch und keine Kostenerstattung."
