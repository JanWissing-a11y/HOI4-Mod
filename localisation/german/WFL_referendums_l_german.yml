 wfl_referendum.21.d:0 "Die Flürener kehren mit ihrem zweiten und letzten Antrag zurück. Die Gäste aus Flüren haben im Rheinland ihre Schützenfeste veranstaltet und nun ein friedliches Beitrittsreferendum beantragt. Wir können dieses Verfahren erlauben oder ohne Gebietsverlust ablehnen. Eine Zustimmung überträgt noch kein Land: Erst 30 Tage später folgt eine gesonderte Abstimmung, deren Ja-Ergebnis wir ausdrücklich anerkennen müssten."
