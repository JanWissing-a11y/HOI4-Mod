l_german:
 WFL_reichspfandministerium:0 "Das Reichspfandministerium"
 WFL_reichspfandministerium_desc:0 "Jede Flasche ist Staatsvermögen! Beamte mit Klemmbrettern durchkämmen die Festzelte, bis selbst der letzte Kronkorken im Wirtschaftskreislauf landet. Das Ministerium steigert die Ressourcengewinnung um 15 %, mildert Rohstoffmangelstrafen um 10 % und erhöht die Fabrikleistung um 5 %."
 WFL_reichspfandministerium_idee:0 "Reichspfandministerium"
 WFL_reichspfandministerium_idee_desc:0 "Pfand ist kein Müll, sondern eine Staatsreserve mit klebrigem Etikett. Organisierte Rückgewinnung stärkt Ressourcen und Industrie."
 WFL_zapfhahnkrise:0 "Die Zapfhahnkrise"
 WFL_zapfhahnkrise_desc:0 "Beim nächsten Staatsbesuch servieren unsere britischen Freunde warmes Bier. Der Graf erklärt die Raumtemperatur zur diplomatischen Herausforderung. Wir lösen die Krise durch einen Kühlhandelsvertrag oder ein freundschaftliches Trinkduell. Fällt Großbritannien als Partner aus, erhalten wir einmalig 50 politische Macht."
 WFL_kuehlkettenkompromiss:0 "Der Kühlkettenkompromiss"
 WFL_kuehlkettenkompromiss_desc:0 "Britische Kühltechnik trifft Flürener Durst: bessere Handelsbeziehungen und produktivere Fabriken."
 WFL_trinkduell_der_freundschaft:0 "Das Trinkduell der Freundschaft"
 WFL_trinkduell_der_freundschaft_desc:0 "Die Ehrenrunde endet unentschieden. Niemand erinnert sich an den Punktestand, aber alle an die neue Freundschaft."
 WFL_zapfhahn_handelsfreundschaft:0 "Diplomatie mit Kühlaggregat"
 WFL_zapfhahn_kuehlhandel:0 "Kühlkettenabkommen"
 WFL_zapfhahn_trinkfreundschaft:0 "Brüder am Zapfhahn"
 wfl_zapfhahn.1.t:0 "Warmbier im Staatsbankett!"
 wfl_zapfhahn.1.d:0 "Der Graf hebt sein Glas, hält inne und bestellt vorsorglich ein Thermometer. Die britische Delegation spricht von Tradition; der Flürener Hof spricht von Sabotage am Wohlbefinden. Ein Dolmetscher übersetzt \"gut temperiert\" versehentlich mit \"Fieberbier\". Noch lässt sich die Krise friedlich lösen."
 wfl_zapfhahn.1.a:0 "Wir verhandeln über Kühltechnik und Handel."
 wfl_zapfhahn.1.b:0 "Ein Trinkduell! Der Verlierer besorgt Eis."
 wfl_zapfhahn.2.t:0 "Die Antwort aus Flüren"
 wfl_zapfhahn.2.a:0 "Die Freundschaft wird eisgekühlt besiegelt."
 wfl_zapfhahn.3.t:0 "Die Zapfhahnkrise ist gelöst"
 wfl_zapfhahn.3.a:0 "Auf eine kühle und herzliche Freundschaft!"
 wfl_zapfhahn.2.trade:0 "Die Flürener Delegation hat einen Vertragsentwurf mitgebracht: britische Kühlaggregate gegen rheinische Lieferverträge, Abnahme garantiert bei jedem Schützenfest. [ENG.GetLeader] lässt das Dokument prüfen. Als das Außenministerium fragt, warum die Temperatur in jedem Absatz vorkommt, legt der Graf wortlos das warme Begrüßungsbier auf den Tisch. Der Eiswürfelvertrag wird noch vor dem Nachtisch gebilligt."
 wfl_zapfhahn.2.duel:0 "Jan Graf von Insel I. fordert [ENG.GetLeader] zum freundschaftlichen Trinkduell. Die Regeln sind einfach: zwei Gläser, ehrliche Punkte und der Verlierer besorgt Eis. Nach der dritten Ehrenrunde verschwinden erst der Punktestand und dann der Schiedsrichter hinter dem Buffet. Die Delegationen erklären vorsorglich, ein Unentschieden sei die höchste Form diplomatischer Einigkeit."
 wfl_zapfhahn.3.trade:0 "Der Eiswürfelvertrag ist unterzeichnet. Britische Kühlaggregate erreichen den Niederrhein; Flürener Betriebe sichern feste Lieferungen zu und bauen neue Kapazitäten auf. Die Presse lobt ein Wirtschaftsabkommen, das erstmals in Grad Celsius verhandelt wurde. Der Graf hebt ein kaltes Glas: \"So fühlt sich Industrieförderung an.\""
 wfl_zapfhahn.3.duel:0 "Das Trinkduell endet offiziell unentschieden. Jan Graf von Insel I. und [ENG.GetLeader] unterschreiben das Kommuniqué, während zwei Beamte vergeblich nach dem Punktestand suchen. Die Flürener Heimat feiert, die Soldaten stoßen auf die Freundschaft an, und der verschwundene Schiedsrichter schickt eine Postkarte: \"Bitte erst wieder anrufen, wenn das Eis geliefert ist.\""
