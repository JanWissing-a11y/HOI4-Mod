l_english:
 WFL_berufskolleg_idee:0 "Wesel Vocational College"
 WFL_berufskolleg_idee_desc:0 "Combining vocational training and research increases our general research speed permanently by 5 percent."
 WFL_berufskolleg_industriebonus:0 "College Industrial Research"
 WFL_rheinblockade:0 "Rhine Blockade"
 WFL_rheinblockade_desc:0 "Some drunken marksmen have blocked the Rhine with club boats, a rope and an exceedingly confident tariff schedule. Germany and the Netherlands are asked to pay passage fees. Whatever their replies, our workshops benefit: civilian and military factory construction each become permanently another 10 percent faster. The events provide further income, if necessary by auctioning the collected empty bottles."
 WFL_alkoholfreies_bier_verbieten:0 "Ban Alcohol-Free Beer"
 WFL_alkoholfreies_bier_verbieten_desc:0 "The drinks committee declares alcohol-free beer an unacceptable deception. The troops respond with surprising enthusiasm. Army morale, the rate of organisation recovery, rises permanently by 10 percent."
 WFL_alkoholfreies_bier_verbot_idee:0 "No Alcohol-Free Beer in the Canteen"
 WFL_alkoholfreies_bier_verbot_idee_desc:0 "The new canteen regulations increase army morale and organisation recovery by 10 percent."
 WFL_flachglas_ruestungsproduktion:0 "Convert Flachglas to Arms Production"
 WFL_flachglas_ruestungsproduktion_desc:0 "The glassworks receive a new assignment. Three military factories and three additional building slots are created immediately in our owned and fully controlled Wesel-Flüren. If the site is lost, demilitarised or the maximum building limits prevent construction, receive 150 political power instead."
 WFL_schuetzen_kriegswirtschaft:0 "Everything for the Marksmen's Economy"
 WFL_schuetzen_kriegswirtschaft_desc:0 "After the glassworks conversion, the government coordinates resources, orders and labour. Adopt War Economy immediately and without a political power cost. If War Economy or Total Mobilisation is already in force, receive 100 political power instead."
 WFL_anglo_bier_diplomatie:0 "Anglo Beer Diplomacy"
 WFL_anglo_bier_diplomatie_desc:0 "A delegation brings pilsner, a marksman's hat and an unusually long toast to Britain. Warm ale, cold pilsner and a diplomatically sensitive serving of fish lead to friendship: the event chain improves mutual opinion by 100 and trade opinion by 50. War or a missing partner provides political compensation instead."
