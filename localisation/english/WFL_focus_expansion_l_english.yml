l_english:
 WFL_zusaetzlicher_forschungsrat:0 "The Flüren Research Council"
 WFL_zusaetzlicher_forschungsrat_desc:0 "A research council connects the vocational college, workshops and independent inventors. This focus grants exactly one additional research slot once, on top of the existing vocational college focus."
 WFL_atomprogramm_am_auesee:0 "The Auesee Atomic Programme"
 WFL_atomprogramm_am_auesee_desc:0 "Under strict secrecy, the Auesee becomes a centre of calculations, measurements and extraordinary coffee consumption. Nuclear technologies gain a permanent +300 percent research speed. Three further +300 percent research bonuses remove four years of ahead-of-time penalties. Reactor, atomic bomb, thermonuclear bomb and nuclear warhead projects receive +400 percent speed; nuclear facilities and both research reactor types are built +300 percent faster. Atomic and thermonuclear bomb production rises by +200 percent. Normal technology, project and deployment requirements still apply."
 WFL_geheimlabor_flueren:0 "The Secret Flüren Laboratory"
 WFL_geheimlabor_flueren_desc:0 "A nuclear research facility is built in province 3512 in our owned and fully controlled Wesel-Flüren state. If the site is occupied by another facility, demilitarised or lost when the focus finishes, we receive 150 political power for revised plans instead. We also receive one level-5 nuclear scientist and five nuclear breakthrough points once. The scientist must then be assigned to a suitable facility; projects are started through the normal interface."
 WFL_flueren_flugzeugwunder:0 "The Flüren Aircraft Miracle"
 WFL_flueren_flugzeugwunder_desc:0 "Our workshops become an aviation legend: all aircraft types have their IC costs reduced by 66.666667 percent to one third. At equal factory output and efficiency, this means triple production. Fighters, carrier aircraft, close support, naval, scout, transport, jet, rocket interceptor, intercontinental and mothership aircraft are covered. Additional cost reductions combine under the normal game rules."
 WFL_auesee_atomoffensive:0 "The Auesee Atomic Drive"
 WFL_auesee_atomoffensive_desc:0 "Very strong nuclear support affecting WFL only: +300 percent nuclear technology research, +400 percent speed for the four named nuclear projects, +300 percent facility/reactor construction, and +200 percent bomb production. Technologies, scientists, breakthroughs and projects remain part of normal development."
 WFL_dreifache_flugzeugfertigung:0 "Triple Aircraft Production"
 WFL_dreifache_flugzeugfertigung_desc:0 "All 20 existing aircraft base and role types cost one third of their normal IC. Without other cost discounts, equal factory output produces three times as many aircraft. Further cost modifiers combine additively; resource shortages and production efficiency still apply. Vehicles, ships, missile ammunition and infantry equipment receive no such discount."
 WFL_atomprogramm_forschungsbonus:0 "Flüren Atomic Research Programme"
