 WFL_BOOKMARK_NAME:0 "Power on the Lower Rhine"
 WFL_BOOKMARK_DESC:0 "On 1 January 1936, the fictional independence of Flüren begins. One existing map province represents the town and its wider surroundings."
 WFL_BOOKMARK_HISTORY:0 "Jan Graf von Insel I. leads the independent Marksmen's State on the Rhine. A small militia protects his order. Strengthening the marksmen's Crown, building an administration under Jan, or choosing a democratic civic republic determines the future path."
