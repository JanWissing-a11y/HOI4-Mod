 WFL_florian_klaus:0 "Florian Klaus"
 WFL_florian_klaus_desc:0 "With a cool head, a steady pipe and a keen eye for full order books, Florian Klaus keeps the economy on course. While appointed as political advisor, he grants +20% civilian and military factory construction speed, +15% factory output and +10 percentage points stability."
 WFL_wirtschaftsstratege_mit_ruhiger_hand:0 "Steady-Handed Economic Strategist"
 WFL_wirtschaftsstratege_mit_ruhiger_hand_desc:0 "More factories, higher output and a reliable budget keep the marksmen content and the country stable."
