l_english:
 WFL_vorstand:0 "Executive Board"
 WFL_vorstand_desc:0 "Every six monthly turns the board votes on the bonuses shown below. Backed motions have 85% approval, unbacked ones 35%; angry members fail. Lobbying costs mood and risks quarrels. Below 40 mood, stability falls; below 20, the penalty increases. Reconciliation decisions improve mood. Exact probabilities and costs are listed on each decision."
 WFL_assembly_blockade_idea:0 "Board Blockade"
 WFL_assembly_blockade_idea_desc:0 "The treasurer will pay nothing until the bottle deposits are settled. Until the next meeting: -5 percentage points stability and -10% political power gain."
 WFL_assembly_eklat_idea:0 "Uproar in the Club Hall"
 WFL_assembly_eklat_idea_desc:0 "The barbecue committee has resigned and the minutes are in the potato salad. All positive motions failed. Until the next meeting: -10% factory output, -10% general construction speed and -5% army organization."
 wfl_assembly.1.t:0 "Flüren's Battalion Has Met"
 wfl_assembly.1.a:0 "Post the minutes on the notice board."
 wfl_assembly.1.d:0 "[WFLAssemblyStory]\n\nNils Meyer: [WFLBoardNilsMeyerLastResult]\nJannik Altenschmidt: [WFLBoardJannikAltenschmidtLastResult]\nTobias Gärtner: [WFLBoardTobiasGaertnerLastResult]\nFinn Bielig: [WFLBoardFinnBieligLastResult]\nMax Gerwers: [WFLBoardMaxGerwersLastResult]\nTim Wissing: [WFLBoardTimWissingLastResult]\n\nResolutions and penalties last until the next battalion assembly."
 WFL_assembly_story_1:0 "After 30 minutes debating a shorter agenda, the meeting begins. Between beer mats and blueprints, the secretary announces the resolutions:"
 WFL_assembly_story_2:0 "Finn's barbecue tongs serve as the speaker's baton. Hand them over and receive a sausage. Flüren has rarely voted in such good order:"
 WFL_assembly_story_3:0 "Nils broadcasts the meeting until Jannik spots the camera pointing at the cash box. After a technical break, the minutes record these decisions:"
 WFL_assembly_story_4:0 "A quarrel over bottle deposits blocks the cash box. Tim's reconciliation round goes unpaid. Alongside the votes, stability and political power gain suffer:"
 WFL_assembly_story_5:0 "A no-confidence vote against the barbecue committee ends with the gavel in the potato salad. All positive motions fail; factories, building and the army suffer."
 WFL_board_lobby_nils_meyer:0 "Nils Meyer: Support the Motion"
 WFL_board_lobby_nils_meyer_desc:0 "Nils persuades the foremen with a phone presentation. The first slide shows his last pub round, but the production chart on slide two wins them over.\n\nPossible resolution: +15% factory and dockyard output.\n\n35 political power; once until the next assembly. 85% backing, 10% backing while angering one random other member, 5% angering this member. Approval with backing is 85%, without it 35%; angry members 0%. Backing does not cancel existing anger. With at least two angry members: 20% blockade (-5 percentage points stability, -10% political power gain), 10% uproar (all positive motions fail; -10% factory output and construction speed, -5% army organization).\n\n[WFLBoardInfluenceMoodRules] Below 40/20 mood, stability falls by 5/10 percentage points."
 WFL_assembly_nils_meyer_idea:0 "Nils Meyer: Adopted Motion"
 WFL_assembly_nils_meyer_idea_desc:0 "+15% factory and dockyard output. Lasts until the next battalion assembly."
 WFL_board_lobby_jannik_altenschmidt:0 "Jannik Altenschmidt: Support the Motion"
 WFL_board_lobby_jannik_altenschmidt_desc:0 "Jannik draws new factories on beer mats. You provide a fresh stack and hope nobody mistakes the blueprints for coasters.\n\nPossible resolution: +15% civilian and military factory construction speed.\n\n35 political power; once until the next assembly. 85% backing, 10% backing while angering one random other member, 5% angering this member. Approval with backing is 85%, without it 35%; angry members 0%. Backing does not cancel existing anger. With at least two angry members: 20% blockade (-5 percentage points stability, -10% political power gain), 10% uproar (all positive motions fail; -10% factory output and construction speed, -5% army organization).\n\n[WFLBoardInfluenceMoodRules] Below 40/20 mood, stability falls by 5/10 percentage points."
 WFL_assembly_jannik_altenschmidt_idea:0 "Jannik Altenschmidt: Adopted Motion"
 WFL_assembly_jannik_altenschmidt_idea_desc:0 "+15% civilian and military factory construction speed. Lasts until the next battalion assembly."
 WFL_board_lobby_tobias_gaertner:0 "Tobias Gärtner: Support the Motion"
 WFL_board_lobby_tobias_gaertner_desc:0 "Tobias wants the agenda completed in marching order. You provide a personal gavel; the next table already suspects mobilization.\n\nPossible resolution: +5% army attack, defence and organization.\n\n35 political power; once until the next assembly. 85% backing, 10% backing while angering one random other member, 5% angering this member. Approval with backing is 85%, without it 35%; angry members 0%. Backing does not cancel existing anger. With at least two angry members: 20% blockade (-5 percentage points stability, -10% political power gain), 10% uproar (all positive motions fail; -10% factory output and construction speed, -5% army organization).\n\n[WFLBoardInfluenceMoodRules] Below 40/20 mood, stability falls by 5/10 percentage points."
 WFL_assembly_tobias_gaertner_idea:0 "Tobias Gärtner: Adopted Motion"
 WFL_assembly_tobias_gaertner_idea_desc:0 "+5% army attack, defence and organization. Lasts until the next battalion assembly."
 WFL_board_lobby_finn_bielig:0 "Finn Bielig: Support the Motion"
 WFL_board_lobby_finn_bielig_desc:0 "Finn proposes a strategic bratwurst reserve. You arrange the grill transport, but mustard versus ketchup threatens a diplomatic incident.\n\nPossible resolution: -10% supply consumption and army training time.\n\n35 political power; once until the next assembly. 85% backing, 10% backing while angering one random other member, 5% angering this member. Approval with backing is 85%, without it 35%; angry members 0%. Backing does not cancel existing anger. With at least two angry members: 20% blockade (-5 percentage points stability, -10% political power gain), 10% uproar (all positive motions fail; -10% factory output and construction speed, -5% army organization).\n\n[WFLBoardInfluenceMoodRules] Below 40/20 mood, stability falls by 5/10 percentage points."
 WFL_assembly_finn_bielig_idea:0 "Finn Bielig: Adopted Motion"
 WFL_assembly_finn_bielig_idea_desc:0 "-10% supply consumption and army training time. Lasts until the next battalion assembly."
 WFL_board_lobby_max_gerwers:0 "Max Gerwers: Support the Motion"
 WFL_board_lobby_max_gerwers_desc:0 "Max says a better slide projector could halve the meeting. You fund his experiments; the treasurer wonders why they require a wind tunnel.\n\nPossible resolution: +5% research speed and +10% production efficiency growth.\n\n35 political power; once until the next assembly. 85% backing, 10% backing while angering one random other member, 5% angering this member. Approval with backing is 85%, without it 35%; angry members 0%. Backing does not cancel existing anger. With at least two angry members: 20% blockade (-5 percentage points stability, -10% political power gain), 10% uproar (all positive motions fail; -10% factory output and construction speed, -5% army organization).\n\n[WFLBoardInfluenceMoodRules] Below 40/20 mood, stability falls by 5/10 percentage points."
 WFL_assembly_max_gerwers_idea:0 "Max Gerwers: Adopted Motion"
 WFL_assembly_max_gerwers_idea_desc:0 "+5% research speed and +10% production efficiency growth. Lasts until the next battalion assembly."
 WFL_board_lobby_tim_wissing:0 "Tim Wissing: Support the Motion"
 WFL_board_lobby_tim_wissing_desc:0 "Tim proposes reconciliation at the bar. You reserve the round while the secretary copies 'lively but comradely' into the minutes in advance.\n\nPossible resolution: +0.15 daily political power and +5 percentage points stability.\n\n35 political power; once until the next assembly. 85% backing, 10% backing while angering one random other member, 5% angering this member. Approval with backing is 85%, without it 35%; angry members 0%. Backing does not cancel existing anger. With at least two angry members: 20% blockade (-5 percentage points stability, -10% political power gain), 10% uproar (all positive motions fail; -10% factory output and construction speed, -5% army organization).\n\n[WFLBoardInfluenceMoodRules] Below 40/20 mood, stability falls by 5/10 percentage points."
 WFL_assembly_tim_wissing_idea:0 "Tim Wissing: Adopted Motion"
 WFL_assembly_tim_wissing_idea_desc:0 "+0.15 daily political power and +5 percentage points stability. Lasts until the next battalion assembly."
