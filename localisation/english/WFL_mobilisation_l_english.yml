l_english:
 WFL_volk_unter_schuetzenhut:0 "A Nation under the Marksmen's Hat"
 WFL_volk_unter_schuetzenhut_desc:0 "From the club register to the very last folding chair, all of Flüren is organized for service. Permanently adds 20 percentage points of recruitable population on top of the conscription law. With Volunteer Only, the quota rises from 1.5% to 21.5% before other factors. New recruits become available through normal mobilization; this is not a one-time manpower gift. Non-core states retain their own penalties."
