l_english:
 WFL_rheinblockade_idee:0 "History's Most Productive Rhine Blockade"
 WFL_rheinblockade_idee_desc:0 "A wobbling customs post becomes a thriving commercial landing. Civilian and military factory construction speed permanently increases by 10 percent each. This support survives regardless of foreign replies."
 WFL_rheinischer_festbeitrag:0 "A Rhenish Festival Contribution"
 WFL_rheinischer_protest:0 "Annoyed by the Marksmen's Customs Post"
 WFL_anglo_bierfreundschaft:0 "Anglo-Flüren Beer Friendship"
 WFL_anglo_bierhandel:0 "Pils, Ale and Open Taps"
 wfl_beer.1.t:0 "Marksmen's Hats Required on the Rhine"
 wfl_beer.1.d:0 "After a remarkably thorough club evening, the Flüren marksmen build a customs post from folding chairs, a washing line and a very official beer mat. The sign reads: Passage requires a festival contribution. The first passing captain waves politely and sails straight under the line.\n\nThe marksmen declare a diplomatic incident. The administration of [WFL.GetLeader] instead spots a business opportunity: a proper landing with shops, workshops and a festival tavern will earn far more than a washing line. Germany and the Netherlands still receive politely worded invoices.\n\nThe construction support is permanent. Each reply grants us 50 political power once: acceptance is a diplomatic success; refusal boosts sales of the now collectible protest beer mats. Missing replies are settled after 30 days."
 wfl_beer.1.a:0 "Send the invoices. Reel in the washing line for now."
 wfl_beer.2.t:0 "An Invoice Bearing the Seal of Hops"
 wfl_beer.2.d:0 "A beer mat bearing a Flüren marksman's hat lies on the desk of [GER.GetLeader]. It demands a Rhenish festival contribution and promises preferred seating, an unobstructed river view and the ceremonial removal of a washing line.\n\nOur officials confirm that shipping is operating normally. We may pay a symbolic contribution or firmly reject the invoice. Payment actually costs 25 political power only if relations remain peaceful and more than 25 political power is available. Flüren's economic support does not depend on our reply."
 wfl_beer.2.a:0 "25 political power for peace on the Rhine and better relations."
 wfl_beer.2.b:0 "We refuse to pay folding-chair tolls!"
 wfl_beer.3.t:0 "The Dutch Answer to the Washing Line"
 wfl_beer.3.d:0 "[HOL.GetLeader] receives surprising news from Flüren: a marksmen's delegation demands a Rhine festival contribution and encloses a potato-salad voucher. The port authority confirms that no ships have been stopped. A clerk nevertheless asks whether the voucher is transferable.\n\nWe can maintain good relations with a symbolic contribution or reject the demand. Payment actually costs 25 political power only if relations remain peaceful and more than 25 political power is available. The clerk has already included the potato salad in the travel-expenses form."
 wfl_beer.3.a:0 "25 political power for good neighbours. Keep the voucher."
 wfl_beer.3.b:0 "The Rhine is not a festival tent car park."
 wfl_beer.4.t:0 "A Refrigerator on a Grand Diplomatic Journey"
 wfl_beer.4.d:0 "The Flüren delegation sets off to meet [ENG.GetLeader]. Its luggage contains marksmen's hats, a keg of pils and a cooling system whose shipping bill impresses even the treasury. The instructions of [WFL.GetLeader] are clear: make friends and discover why British beer can be warmer than Flüren's outdoor swimming pool.\n\nBritish protocol offers an invitation to an ale evening. Flüren accepts and cautiously asks about electrical sockets. The resulting friendship should provide permanent mutual +100 opinion and +50 trade opinion. If circumstances prevent its conclusion or no reply arrives within 30 days, the trip is settled with 50 political power once."
 wfl_beer.4.a:0 "Across the Channel! Keep that keg away from the radiator."
 wfl_beer.5.t:0 "Pils, Ale and the Correct Temperature"
 wfl_beer.5.d:0 "[ENG.GetLeader] receives the Flüren delegation. Formalities proceed smoothly until a marksman explains that the ale is excellent, provided one considers it soup. The interpreter chokes. Fortunately, the British leader laughs first.\n\nFish and chips rescue world peace at dinner. The British admire the marksmen's hats, the visitors discover the merits of a pub, and both parties agree on a groundbreaking principle: every beer has a right to its own temperature. This friendship treaty even fits on a proper sheet of paper.\n\nIf both countries still exist, have not capitulated and remain at peace with each other, both gain permanent +100 opinion and +50 trade opinion. Flüren also gains 75 political power. Otherwise Flüren receives 50 political power once to settle the trip."
 wfl_beer.5.a:0 "To friendship! Thermometers remain optional."
 wfl_beer.6.t:0 "A Marksman's Hat in a British Pub"
 wfl_beer.6.d:0 "Beer diplomacy has succeeded. Lasting friendship and preferred trade contacts have been agreed with [ENG.GetLeader]. Flüren ceremonially places a keg of ale beside the pils. At the protocol office's insistence, each keg receives its own thermometer.\n\nThe delegation returns with fish-and-chips recipes, an invitation for a return visit and a remarkably intact refrigerator. Mutual opinion increases by 100 and trade opinion by 50. The agreement does not create an alliance or an obligation to join wars."
 wfl_beer.6.fallback:0 "Diplomatic circumstances changed or no British reply arrived. The delegation therefore returns without a friendship agreement. At least the refrigerator still works, and settling the trip grants 50 political power once. The marksmen announce that they had intended to inspect the taps back home anyway."
 wfl_beer.6.a:0 "Give the refrigerator a place of honour."
