 WFL_board_ui_nils_meyer_name:0 "Nils Meyer"
 WFL_board_ui_nils_meyer_role:0 "§YIndustry§!"
 WFL_board_ui_nils_meyer_tooltip:0 "§YNils Meyer · Industry§!\nNils records every speech on his phone. His proposal: double the production figures first, then take the group photo.\n\nPossible resolution: §G+15%§! factory and dockyard output.\nNext assembly: [WFLBoardNilsMeyerStatus]\nLast resolution: [WFLBoardNilsMeyerLastResult]\n\nInfluence through the decision below: 35 political power, once per member and assembly. 85% clean backing, 10% backing that angers another member, 5% angering this member. A general row can still prevent resolutions."
 WFL_board_ui_jannik_altenschmidt_name:0 "Jannik Altenschmidt"
 WFL_board_ui_jannik_altenschmidt_role:0 "§YConstruction§!"
 WFL_board_ui_jannik_altenschmidt_tooltip:0 "§YJannik Altenschmidt · Construction§!\nJannik explains construction plans on a beer mat. If the new factory does not fit on the table, he simply orders a bigger table.\n\nPossible resolution: §G+15%§! civilian and military factory construction speed.\nNext assembly: [WFLBoardJannikAltenschmidtStatus]\nLast resolution: [WFLBoardJannikAltenschmidtLastResult]\n\nInfluence through the decision below: 35 political power, once per member and assembly. 85% clean backing, 10% backing that angers another member, 5% angering this member. A general row can still prevent resolutions."
 WFL_board_ui_tobias_gaertner_name:0 "Tobias Gärtner"
 WFL_board_ui_tobias_gaertner_role:0 "§YArmy§!"
 WFL_board_ui_tobias_gaertner_tooltip:0 "§YTobias Gärtner · Army§!\nTobias counts even the rows of chairs during parade. His battle plan begins with an orderly agenda and ends with a very disorderly opponent.\n\nPossible resolution: §G+5%§! army attack, defence and organisation.\nNext assembly: [WFLBoardTobiasGaertnerStatus]\nLast resolution: [WFLBoardTobiasGaertnerLastResult]\n\nInfluence through the decision below: 35 political power, once per member and assembly. 85% clean backing, 10% backing that angers another member, 5% angering this member. A general row can still prevent resolutions."
 WFL_board_ui_finn_bielig_name:0 "Finn Bielig"
 WFL_board_ui_finn_bielig_role:0 "§YSupply§!"
 WFL_board_ui_finn_bielig_tooltip:0 "§YFinn Bielig · Supply§!\nFinn personally commands the sausage reserve. As long as nobody misplaces the barbecue tongs, every supply truck reaches its company on time.\n\nPossible resolution: §G-10%§! supply consumption and army training time.\nNext assembly: [WFLBoardFinnBieligStatus]\nLast resolution: [WFLBoardFinnBieligLastResult]\n\nInfluence through the decision below: 35 political power, once per member and assembly. 85% clean backing, 10% backing that angers another member, 5% angering this member. A general row can still prevent resolutions."
 WFL_board_ui_max_gerwers_name:0 "Max Gerwers"
 WFL_board_ui_max_gerwers_role:0 "§YResearch§!"
 WFL_board_ui_max_gerwers_tooltip:0 "§YMax Gerwers · Research§!\nMax takes apart the slide projector to speed up the meeting. He rebuilds it as a more efficient machine; the slides have been classified ever since.\n\nPossible resolution: §G+5%§! research speed and §G+10%§! production efficiency growth.\nNext assembly: [WFLBoardMaxGerwersStatus]\nLast resolution: [WFLBoardMaxGerwersLastResult]\n\nInfluence through the decision below: 35 political power, once per member and assembly. 85% clean backing, 10% backing that angers another member, 5% angering this member. A general row can still prevent resolutions."
 WFL_board_ui_tim_wissing_name:0 "Tim Wissing"
 WFL_board_ui_tim_wissing_role:0 "§YCohesion§!"
 WFL_board_ui_tim_wissing_tooltip:0 "§YTim Wissing · Cohesion§!\nTim finds a reason to toast even in the treasurer's report. When two marksmen argue, he moves their reconciliation to the bar.\n\nPossible resolution: daily §G+0.15§! political power and §G+5 percentage points§! stability.\nNext assembly: [WFLBoardTimWissingStatus]\nLast resolution: [WFLBoardTimWissingLastResult]\n\nInfluence through the decision below: 35 political power, once per member and assembly. 85% clean backing, 10% backing that angers another member, 5% angering this member. A general row can still prevent resolutions."


