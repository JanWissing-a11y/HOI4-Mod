l_english:
 WFL_brauereiverbund:0 "The Flüren Brewery Cooperative"
 WFL_brauereiverbund_desc:0 "Our breweries join forces. The treasurer discovers that delivery trucks can also carry machinery. Civilian factory construction becomes permanently 10 percent faster, followed by an event with two festival rewards to choose from."
 WFL_festlogistik:0 "Festival-Grade Logistics"
 WFL_festlogistik_desc:0 "Anyone able to supply a festival tent with food, drinks and dry socks can also organise an army supply train. Our army's supply consumption falls permanently by 8 percent."
 WFL_schuetzenakademie:0 "The Flüren Marksmen's Academy"
 WFL_schuetzenakademie_desc:0 "Leadership, cooperation and marching without a brass band form the curriculum. We receive 15 army experience and permanently gain 5 percent army organisation."
 WFL_vereinsdiplomatie:0 "Foreign Policy with Club Badges"
 WFL_vereinsdiplomatie_desc:0 "Our diplomats travel with gifts and a surprisingly extensive festival calendar. The ongoing cost of improving diplomatic relations falls permanently by 15 percent."
 WFL_schuetzenolympiade:0 "The Great Marksmen's Olympics"
 WFL_schuetzenolympiade_desc:0 "Jan invites everyone to compete. During the flag ceremony, the organisers debate whether the trophy may be presented empty. An event offers a choice between military practice and additional recruits."
 WFL_weltkongress_des_schuetzenwesens:0 "World Congress of the Marksmen"
 WFL_weltkongress_des_schuetzenwesens_desc:0 "After the Olympics, Jan invites guests from around the world. The civic hall has always considered world politics a matter of having enough tables. Choose understanding or additional recruitment in the subsequent event."
 WFL_tag_der_offenen_labortuer:0 "Laboratory Open Day"
 WFL_tag_der_offenen_labortuer_desc:0 "The researchers open their doors. Visitors may ask anything, although the strategically vital coffee machine remains under guard. An event offers an industrial research bonus or political support."
 WFL_rheinischer_forschungsbund:0 "The Rhine Research Association"
 WFL_rheinischer_forschungsbund_desc:0 "The vocational college, laboratory and local workshops share their results. Even the treasurer admits an idea may have value without a bottle deposit. Gain permanently 5 percent general research speed."
 WFL_jans_goldene_festordnung:0 "Jan's Golden Festival Charter"
 WFL_jans_goldene_festordnung_desc:0 "Jan Graf von Insel I. issues a royal charter for efficient administration and exceptionally well-planned festivals. While he remains in power, gain 5 percent stability and 100 political power. If leadership changes during preparation, receive 25 political power instead."
 WFL_buergerhalle_fuer_alle:0 "A Civic Hall for Everyone"
 WFL_buergerhalle_fuer_alle_desc:0 "The republic combines free research with open local government. Under democratic government, gain 10 percent stability and 75 political power. If this government is lost during preparation, receive 25 political power instead."
 WFL_schuetzenbund_am_niederrhein:0 "The Lower Rhine Marksmen's Federation"
 WFL_schuetzenbund_am_niederrhein_desc:0 "Following the actual union of Rhineland and Westphalia, Jan establishes a common administration. While we remain at peace and fully control both core states, gain 10 percent war support, 25 army experience and 100 political power. Otherwise, receive 25 political power."
