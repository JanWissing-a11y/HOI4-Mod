 WFL_schuetzenkoenig:0 "Marksmen's King of Flüren"
 WFL_direktorium:0 "Lower Rhine Directorate"
 WFL_kleine_verwaltung:0 "An Administration in the Making"
 WFL_kleine_verwaltung_desc:0 "A small administration must shoulder the responsibilities of an entire country."
 WFL_rheinhandel:0 "Rhine Trade"
 WFL_rheinhandel_desc:0 "Commercial contacts along the Rhine help us develop our civilian economy."
 WFL_schuetzenverbaende:0 "Regional Marksmen's Associations"
 WFL_schuetzenverbaende_desc:0 "Local knowledge and regular exercises strengthen our defence."
 WFL_koenigsgarde:0 "The Royal Guard"
