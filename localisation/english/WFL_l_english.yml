 WFL_rat_der_buergerhalle:0 "The Civic Hall Council"
 WFL_rat_der_buergerhalle_desc:0 "Our civic hall becomes the starting point for organising the state."
 WFL_werkbank_am_niederrhein:0 "Workshop of the Lower Rhine"
 WFL_werkbank_am_niederrhein_desc:0 "Local crafts and businesses need a common political voice."
 WFL_rheinhandel_beleben:0 "Revive Rhine Trade"
 WFL_rheinhandel_beleben_desc:0 "We establish new contacts with trading centres along the river."
 WFL_schuetzen_zu_soldaten:0 "From Marksmen to Soldiers"
 WFL_schuetzen_zu_soldaten_desc:0 "Voluntary associations shall become a reliable defensive organisation."
 WFL_uebungsplatz_am_auesee:0 "Exercises at the Auesee"
 WFL_uebungsplatz_am_auesee_desc:0 "Joint exercises will improve cooperation between our formations."
 WFL_buergerverfassung:0 "The Citizens' Constitution"
 WFL_buergerverfassung_desc:0 "An elected body shall determine the future of our country."
 WFL_kommunaler_aufbau:0 "Municipal Development"
 WFL_kommunaler_aufbau_desc:0 "Reliable local institutions strengthen confidence in the civic republic."
 WFL_die_krone_von_flueren:0 "The Crown of Flüren"
 WFL_die_krone_von_flueren_desc:0 "Local marksmen's traditions become the foundation of a fictional monarchy."
 WFL_die_koenigsgarde:0 "Establish the Royal Guard"
 WFL_die_koenigsgarde_desc:0 "The Crown needs a dependable military organisation."
 WFL_niederrhein_direktorium:0 "The Lower Rhine Directorate"
 WFL_niederrhein_direktorium_desc:0 "A joint directorate shall concentrate administration and defence."
 WFL_verwaltung_buendeln:0 "Consolidate the Administration"
 WFL_verwaltung_buendeln_desc:0 "Clear responsibilities will overcome the weaknesses of the provisional administration."
 wfl.1.t:0 "The Crown of Flüren"
 wfl.1.d:0 "The Marksmen's King is proclaimed head of state in the civic hall. The new Crown shall unite tradition and responsibility. The citizens' council hands over its duties."
 wfl.1.a:0 "Long live the Marksmen's King!"
 wfl.2.t:0 "A Constitution for the Citizens"
 wfl.2.d:0 "The new constitution entrusts the government to a democratic Civic Presidency, giving the provisional order a permanent foundation."
 wfl.2.a:0 "Responsibility rests with the citizens."
 WFL_local_initiatives:0 "Lower Rhine Initiatives"
 WFL_local_initiatives_desc:0 "Targeted projects support the development of our small state."
 WFL_organisiertes_exerzieren:0 "Joint Drill"
 WFL_organisiertes_exerzieren_desc:0 "A one-time exercise increases the military experience of our formations."
 WFL_rheinhandelsmesse:0 "Hold a Rhine Trade Fair"
 WFL_rheinhandelsmesse_desc:0 "A one-time fair strengthens confidence in our economic future."
