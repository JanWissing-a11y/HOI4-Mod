l_english:
 WFL:0 "Flüren"
 WFL_DEF:0 "Flüren"
 WFL_ADJ:0 "Flürener"
 WFL_buergerrat:0 "Flüren Citizens' Council"
 WFL_buergerpraesidium:0 "Civic Presidency"
 WFL_schuetzenkoenig:0 "Jan Graf von Insel I."
 WFL_direktorium:0 "Marksmen's Administrative Council"
 WFL_kleine_verwaltung:0 "An Administration in the Making"
 WFL_kleine_verwaltung_desc:0 "A small administration must shoulder the responsibilities of an entire country."
 WFL_rheinhandel:0 "Rhine Trade"
 WFL_rheinhandel_desc:0 "Contacts along the Rhine permanently accelerate civilian and military factory construction by 15 percent each."
 WFL_schuetzenverbaende:0 "Regional Marksmen's Associations"
 WFL_schuetzenverbaende_desc:0 "Local knowledge and regular exercises strengthen our defence."
 WFL_koenigsgarde:0 "The Royal Guard"
 WFL_koenigsgarde_desc:0 "A small, well-organised formation forms the backbone of the royal forces."
 WFL_rat_der_buergerhalle:0 "The Civic Hall Council"
 WFL_rat_der_buergerhalle_desc:0 "Our civic hall becomes the starting point for organising the state."
 WFL_werkbank_am_niederrhein:0 "Workshop of the Lower Rhine"
 WFL_werkbank_am_niederrhein_desc:0 "Local workshops establish one civilian factory in our owned and controlled capital state. If control or building capacity is unavailable, we receive 50 political power for further planning instead."
 WFL_rheinhandel_beleben:0 "Revive Rhine Trade"
 WFL_rheinhandel_beleben_desc:0 "We connect ports, workshops and trading houses. Civilian and military factories are each built permanently 15 percent faster."
 WFL_schuetzen_zu_soldaten:0 "From Marksmen to Soldiers"
 WFL_schuetzen_zu_soldaten_desc:0 "Voluntary associations shall become a reliable defensive organisation."
 WFL_uebungsplatz_am_auesee:0 "Exercises at the Auesee"
 WFL_uebungsplatz_am_auesee_desc:0 "Joint exercises will improve cooperation between our formations."
 WFL_buergerverfassung:0 "The Citizens' Constitution"
 WFL_buergerverfassung_desc:0 "An elected body shall determine the future of our country."
 WFL_kommunaler_aufbau:0 "Municipal Development"
 WFL_kommunaler_aufbau_desc:0 "Reliable local institutions strengthen confidence in the civic republic and overcome the weaknesses of the provisional administration."
 WFL_die_krone_von_flueren:0 "The Crown of Flüren"
 WFL_die_krone_von_flueren_desc:0 "Jan Graf von Insel I. formally anchors his existing leadership in the local marksmen's tradition. A coronation ceremony strengthens his office and its ties to the associations."
 WFL_die_koenigsgarde:0 "Establish the Royal Guard"
 WFL_die_koenigsgarde_desc:0 "The Crown needs a dependable military organisation."
 WFL_niederrhein_direktorium:0 "The Marksmen's Administration"
 WFL_niederrhein_direktorium_desc:0 "Jan Graf von Insel I. combines administration and defence in an organised Marksmen's Administration. He remains the leader of the Schützenwesen; its council carries out his decisions."
 WFL_verwaltung_buendeln:0 "Consolidate the Administration"
 WFL_verwaltung_buendeln_desc:0 "The Marksmen's Administration under Jan Graf von Insel I. establishes clear responsibilities and overcomes the weaknesses of the provisional offices."
 wfl.1.t:0 "The Crown of Flüren"
 wfl.1.d:0 "Jan Graf von Insel I. already governs Flüren as the head of the Schützenwesen. A formal coronation in the civic hall now reaffirms his position. The civic council and marksmen's associations pledge to unite tradition with responsibility for the state."
 wfl.1.a:0 "Long live the Marksmen's King!"
 wfl.2.t:0 "A Constitution for the Citizens"
 wfl.2.d:0 "Under the new constitution, Jan Graf von Insel I. hands government to an elected Civic Presidency. This democratic path is an explicit alternative to government through the Schützenwesen."
 wfl.2.a:0 "Responsibility rests with the citizens."
 WFL_local_initiatives:0 "Lower Rhine Initiatives"
 WFL_local_initiatives_desc:0 "Targeted projects support the development of our small state."
 WFL_organisiertes_exerzieren:0 "Joint Drill"
 WFL_organisiertes_exerzieren_desc:0 "A one-time exercise increases the military experience of our formations."
 WFL_rheinhandelsmesse:0 "Hold a Rhine Trade Fair"
 WFL_rheinhandelsmesse_desc:0 "A one-time fair strengthens confidence in our economic future."
