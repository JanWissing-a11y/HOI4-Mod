 WFL_KINGDOM_neutrality_DEF:0 "Flüren"
 WFL_KINGDOM_neutrality_ADJ:0 "Flürener"
 WFL_gewerbehoefe:0 "Lower Rhine Workshops"
 WFL_gewerbehoefe_desc:0 "Shared workshops and coordinated deliveries improve the efficiency of our production lines."
 WFL_ruestungswerkstatt:0 "The Armaments Workshop"
 WFL_ruestungswerkstatt_desc:0 "One military factory is established in our owned and controlled capital state. If control or building capacity is unavailable, we receive 50 political power for revised plans instead."
 WFL_technikschule:0 "Wesel Vocational College"
 WFL_technikschule_desc:0 "Wesel Vocational College combines practical training with modern research. Gain permanently 5 percent research speed, two 100 percent industrial research bonuses and one additional research slot. If we already have at least four slots, receive 75 political power instead of the slot. The separate Research Council still grants its own additional slot."
 WFL_berliner_tor_sichern:0 "Secure the Berliner Tor"
 WFL_berliner_tor_sichern_desc:0 "Standard basic instruction and prepared alarm plans reduce training time for our home defence."
 WFL_standardisierte_gewehre:0 "Standardise Our Rifles"
 WFL_standardisierte_gewehre_desc:0 "A one-time government order of 250 infantry weapons standardises the equipment of our formations."
 WFL_offene_haushalte:0 "Open Budgets"
 WFL_offene_haushalte_desc:0 "Public budget debates and accountable spending strengthen the civic republic."
 WFL_forschungsgemeinschaft:0 "A Free Research Community"
 WFL_forschungsgemeinschaft_desc:0 "The vocational college and civic council combine applied research with the free exchange of ideas."
 WFL_bewaffnete_neutralitaet:0 "Armed Neutrality"
 WFL_bewaffnete_neutralitaet_desc:0 "The kingdom organises stockpiles and transport for an economical defensive army. Our neutrality rests on careful preparation."
 WFL_mobilmachungsplan:0 "The Mobilisation Plan"
 WFL_mobilmachungsplan_desc:0 "The Marksmen's Administration under Jan Graf von Insel I. registers volunteers and makes a limited additional share of the population available for military service."
 WFL_gewerbliche_zusammenarbeit:0 "Industrial Cooperation"
 WFL_gewerbliche_zusammenarbeit_desc:0 "Coordinated suppliers improve our rate of production efficiency growth."
 WFL_heimatverteidigung:0 "Prepared Home Defence"
 WFL_heimatverteidigung_desc:0 "Shared instruction plans reduce training time for regional formations."
 WFL_buergerhaushalt:0 "The Citizens' Budget"
 WFL_buergerhaushalt_desc:0 "A transparent budget builds confidence in our democratic institutions."
 WFL_freie_wissenschaft:0 "Free Science on the Lower Rhine"
 WFL_freie_wissenschaft_desc:0 "Cooperation between our research institutions improves research speed."
 WFL_bewaffnete_neutralitaet_idee:0 "Supplying Neutrality"
 WFL_bewaffnete_neutralitaet_idee_desc:0 "Careful stockpiling reduces the supply consumption of our army."
 WFL_reserveorganisation:0 "An Organised Reserve"
 WFL_reserveorganisation_desc:0 "A formal register makes an additional 0.5 percent of our population available for military service."
 WFL_instandsetzungsdienst_idee:0 "Municipal Repair Service"
 WFL_instandsetzungsdienst_idee_desc:0 "For a limited time, local tradespeople coordinate repairs to damaged buildings."
 WFL_instandsetzungsdienst:0 "Commission the Repair Service"
 WFL_instandsetzungsdienst_desc:0 "40 political power funds 90 days of 15 percent faster building repairs. The service can be commissioned again after 180 days."
 WFL_munitionsreserve:0 "Purchase an Equipment Reserve"
 WFL_munitionsreserve_desc:0 "For 50 political power we make a one-time purchase of 150 infantry weapons."
 WFL_buergerforum:0 "Convene a Citizens' Forum"
 WFL_buergerforum_desc:0 "A one-time public forum strengthens the stability of the civic republic."
 WFL_ehrengarde:0 "Train the Honour Guard"
 WFL_ehrengarde_desc:0 "A one-time Royal Guard training course provides additional army experience."
 WFL_freiwilligenreserve:0 "Call Up the Volunteer Reserve"
 WFL_freiwilligenreserve_desc:0 "The Marksmen's Administration calls up 1,000 registered volunteers for service under Jan Graf von Insel I. once. Organising the mobilisation costs 75 political power."
 wfl.3.t:0 "Marksmen's Administration under Jan Graf von Insel I."
 wfl.3.d:0 "Jan Graf von Insel I. establishes a joint Marksmen's Administrative Council for public offices and national defence. He remains head of state and leader of the Schützenwesen. The new council coordinates the execution of his decisions."
 wfl.3.a:0 "In service to the Schützenwesen."
 wfl.4.t:0 "A Research Community Takes Shape"
 wfl.4.d:0 "Tradespeople, teachers and young researchers will work together on the challenges facing our small state. The civic republic gains a place for applied research and the free exchange of ideas."
 wfl.4.a:0 "Knowledge creates a future."
 WFL_niederrheinische_ansprueche:0 "Lower Rhine Claims"
 WFL_niederrheinische_ansprueche_desc:0 "The Marksmen's Administration under Jan Graf von Insel I. claims the remaining Rhineland and Westphalia. These demands transfer no territory: their owners will defend their interests."
 WFL_rheinland_fordern:0 "Demand the Rhineland"
 WFL_rheinland_fordern_desc:0 "We prepare a territorial war goal against the remaining Rhineland state's current owner. Allies, our subjects and countries already at war with us are excluded. If those conditions change during preparation, we receive 50 political power instead. Owning the state already bypasses this focus. A war goal neither declares war nor guarantees victory."
 WFL_westfalen_fordern:0 "Demand Westphalia"
 WFL_westfalen_fordern_desc:0 "We prepare a territorial war goal against Westphalia's current owner. Allies, our subjects and countries already at war with us are excluded. If those conditions change during preparation, we receive 50 political power instead. Owning the state already bypasses this focus. Subsequent integration requires actual ownership."
 WFL_niederrheinunion:0 "Proclaim the Lower Rhine Union"
 WFL_niederrheinunion_desc:0 "Only after the Rhineland and Westphalia are owned, fully controlled and integrated can Jan Graf von Insel I. and his Marksmen's Administration proclaim a regional union in peacetime. The proclamation transfers no additional territory. If control is lost or war begins during preparation, we receive 25 political power instead."
 WFL_rheinland_integrieren:0 "Integrate the Rhineland"
 WFL_rheinland_integrieren_desc:0 "A one-time investment of 100 political power makes the remaining Rhineland state our core territory. After completing its territorial focus, we must actually own and fully control the state, and our country must be at peace. Wartime occupation is insufficient."
 WFL_westfalen_integrieren:0 "Integrate Westphalia"
 WFL_westfalen_integrieren_desc:0 "A one-time investment of 150 political power makes Westphalia our core territory. After completing its territorial focus, we must actually own and fully control the state, and our country must be at peace. This decision transfers no foreign territory."
 WFL_neutrality_party:0 "Schützenwesen"
 WFL_neutrality_party_long:0 "Schützenwesen under Jan Graf von Insel I."
 WFL_KINGDOM_neutrality_party:0 "Schützenwesen"
 WFL_KINGDOM_neutrality_party_long:0 "Schützenwesen under Jan Graf von Insel I."
 WFL_democratic_party:0 "Civic Presidency"
 WFL_democratic_party_long:0 "Elected Civic Presidency of Flüren"
