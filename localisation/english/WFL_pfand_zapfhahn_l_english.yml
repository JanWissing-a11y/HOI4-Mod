l_english:
 WFL_reichspfandministerium:0 "The Imperial Deposit Ministry"
 WFL_reichspfandministerium_desc:0 "Every bottle is state property! Clipboard-wielding officials comb the festival tents until the final bottle cap rejoins the economy. Resource extraction rises by 15%, resource shortage penalties fall by 10%, and factory output rises by 5%."
 WFL_reichspfandministerium_idee:0 "Imperial Deposit Ministry"
 WFL_reichspfandministerium_idee_desc:0 "A deposit bottle is a strategic reserve with a sticky label. Organised recovery strengthens resources and industry."
 WFL_zapfhahnkrise:0 "The Tap Crisis"
 WFL_zapfhahnkrise_desc:0 "Our British friends serve warm beer at the next state visit. The Count calls room temperature a diplomatic challenge. Resolve it through refrigeration trade or a friendly drinking contest. If Britain becomes unavailable, receive 50 political power once."
 WFL_kuehlkettenkompromiss:0 "The Cold-Chain Compromise"
 WFL_kuehlkettenkompromiss_desc:0 "British refrigeration meets the thirst of Flüren: improved trade and more productive factories."
 WFL_trinkduell_der_freundschaft:0 "The Drinking Contest of Friendship"
 WFL_trinkduell_der_freundschaft_desc:0 "The honour round ends in a draw. Nobody remembers the score, but everybody remembers the friendship."
 WFL_zapfhahn_handelsfreundschaft:0 "Refrigerated Diplomacy"
 WFL_zapfhahn_kuehlhandel:0 "Cold-Chain Agreement"
 WFL_zapfhahn_trinkfreundschaft:0 "Brothers at the Tap"
 wfl_zapfhahn.1.t:0 "Warm Beer at the State Banquet!"
 wfl_zapfhahn.1.d:0 "The Count raises his glass, pauses, and orders a thermometer. The British delegation calls it tradition; the court of Flüren calls it sabotage of well-being. An interpreter accidentally translates \"well tempered\" as \"fever beer\". A peaceful solution is still possible."
 wfl_zapfhahn.1.a:0 "Negotiate refrigeration technology and trade."
 wfl_zapfhahn.1.b:0 "A friendly drinking contest! The loser fetches ice."
 wfl_zapfhahn.2.t:0 "A Reply from Flüren"
 wfl_zapfhahn.2.a:0 "Seal our friendship on ice."
 wfl_zapfhahn.3.t:0 "The Tap Crisis Is Resolved"
 wfl_zapfhahn.3.a:0 "To a cool and cordial friendship!"
 wfl_zapfhahn.2.trade:0 "The delegation from Flüren presents a draft: British refrigeration equipment in return for Rhineland supply contracts, with every shooting-club festival guaranteeing demand. [ENG.GetLeader] orders a review. When the Foreign Office asks why temperature appears in every paragraph, the Count silently places his warm welcome beer on the table. The Ice Cube Treaty is approved before dessert."
 wfl_zapfhahn.2.duel:0 "Jan Graf von Insel I. challenges [ENG.GetLeader] to a friendly drinking contest. The rules are simple: two glasses, honest scoring, and the loser fetches ice. By the third honorary round, first the score sheet and then the referee disappear behind the buffet. Both delegations announce that a draw represents the highest form of diplomatic agreement."
 wfl_zapfhahn.3.trade:0 "The Ice Cube Treaty is signed. British refrigeration equipment reaches the Lower Rhine while factories in Flüren secure deliveries and expand capacity. The press praises the first economic agreement negotiated in degrees Celsius. Raising a cold glass, the Count declares: \"This is what industrial development feels like.\""
 wfl_zapfhahn.3.duel:0 "The drinking contest officially ends in a draw. Jan Graf von Insel I. and [ENG.GetLeader] sign the communique while two officials search for the score sheet. The homeland celebrates and soldiers toast the friendship. A postcard arrives from the missing referee: \"Please do not call again until the ice has been delivered.\""
