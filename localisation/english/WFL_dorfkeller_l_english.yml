l_english:
 WFL_dorfkeller_diplomatie:0 "Dorfkeller Diplomacy"
 WFL_dorfkeller_diplomatie_desc:0 "Following Anglo-Beer Diplomacy and the Tap Crisis, we invite the British delegation to the village cellar. Between the bowling alley and the taps, friendship becomes an alliance. After 35 days we join the Allies, provided Britain still belongs to them, their current leader can act, Flüren remains independent, undefeated and outside any faction, and we are not at war with any Allied member. The outcome of the Tap Crisis is not an additional requirement. If changed circumstances prevent accession at completion, we receive 50 political power once."
 WFL_dorfkeller_voraussetzungen_tt:0 "Wesel-Flüren is independent, has not capitulated and belongs to no faction. Britain exists and belongs to the Allies. The current faction leader exists, is independent and has not capitulated. We are not at war with any Allied member. Membership does not depend on the British form of government or the outcome of the Tap Crisis."
 WFL_dorfkeller_beitritt_tt:0 "Wesel-Flüren immediately joins the Allies if the conditions remain valid, followed by a celebration of the Village Cellar Treaty. If accession has become impossible at completion, we receive §G50§! political power once."
 wfl_dorfkeller.1.t:0 "The Village Cellar Treaty"
 wfl_dorfkeller.1.d:0 "The British delegation searches for the conference hall and finds the bowling alley. A marksman promptly hangs up a sign: ALLIED CONFERENCE ROOM – LANE TWO. [WFL.GetLeader] welcomes the guests at the regulars' table while the landlord promises that this time the beer really is cold.\n\nWhen [ENG.GetLeader] asks for a draft treaty, the treasurer slides over a beer mat. Front: mutual assistance. Back: whoever leaves last carries the glasses upstairs. After a ceremonial round, the delegation signs both sides. London confirms Wesel-Flüren's accession to the Allies; only the question of whether a bowling lane counts as diplomatic ground remains unresolved.\n\nThe landlord frames the document. Just to be safe, he sends the deposit receipt to the national archives."
 wfl_dorfkeller.1.a:0 "To the Allies! The next round is on Flüren."
