l_english:
 WFL_roemerwardt_ausbauen:0 "Expand the Römerwardt Airfield"
 WFL_roemerwardt_ausbauen_desc:0 "Römerwardt's quiet runway will become the gateway to Flüren's skies. Completing the focus instantly upgrades the air base to level 5. An existing larger air base is preserved. Flüren must still own and fully control its location, must not have capitulated and the site must not be demilitarized. If any of these conditions no longer holds when the focus finishes, we receive 50 political power instead. Our first joint flying exercises grant 10 air experience in every case. The groundskeeper merely asks everyone to secure their ceremonial hats before takeoff."
 WFL_roemerwardt_flugschule:0 "Römerwardt Flying School"
 WFL_roemerwardt_flugschule_desc:0 "Our instructors patiently explain that a circuit is neither a round of drinks nor a victory lap around the community hall. A shared syllabus, scheduled exercises and thorough debriefings build a capable flying school. We gain 35 air experience and a permanent 20 percent increase to air wing experience gained during training."
 WFL_roemerwardt_luftfahrtwerkstaetten:0 "Workshops by the Runway"
 WFL_roemerwardt_luftfahrtwerkstaetten_desc:0 "Flüren's mechanics establish workshops beside the airfield. The people who maintained the club car now keep meticulous records for engines and wings. Their foreman insists that a ceremonial ribbon on the propeller is not an aerodynamic improvement. We gain 25 air experience, permanently reduce air accidents by 20 percent and increase aircraft range by 10 percent."
 WFL_roemerwardt_luftwaffenakademie:0 "Römerwardt Air Academy"
 WFL_roemerwardt_luftwaffenakademie_desc:0 "Flying instructors, mechanics and mission planners train together at a common academy. During map exercises, the clubhouse is merely a landmark; weather reports, radio discipline and coordinated mission plans now shape the syllabus. Graduation grants 50 air experience and a permanent 10 percent increase in air mission efficiency."
 WFL_roemerwardt_flugschule_idee:0 "Römerwardt Flying School"
 WFL_roemerwardt_flugschule_idee_desc:0 "A consistent training programme increases the experience gained by air wings during exercises by 20 percent."
 WFL_roemerwardt_luftfahrtwerkstaetten_idee:0 "Römerwardt Aviation Workshops"
 WFL_roemerwardt_luftfahrtwerkstaetten_idee_desc:0 "Careful maintenance and technical improvements reduce air accidents by 20 percent and increase aircraft range by 10 percent."
 WFL_roemerwardt_luftwaffenakademie_idee:0 "Römerwardt Air Academy"
 WFL_roemerwardt_luftwaffenakademie_idee_desc:0 "Joint training for aircrews, ground personnel and operational staffs increases air mission efficiency by 10 percent."
