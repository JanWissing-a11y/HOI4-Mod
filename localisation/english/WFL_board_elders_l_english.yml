l_english:
 WFL_geschaeftsordnung_bierdeckel:0 "Standing Orders on a Beer Mat"
 WFL_geschaeftsordnung_bierdeckel_desc:0 "After the third debate about the order of debates, the secretary introduces standing orders. Since the back of the accounts book is already reserved for lighting the barbecue, the whole rulebook fits on a beer mat: let people finish, number every motion, never promise someone else's round. Political lobbying will now cost the board a quarter less morale."
 WFL_board_bierdeckel_rules_tt:0 "All mood losses caused by lobbying permanently fall by §G25%§!: base loss §Y9§! instead of 12; angering another member costs an additional §Y4.5§! instead of 6; angering the approached member costs an additional §Y6§! instead of 8. Costs, voting chances and assembly quarrel consequences remain unchanged."
 WFL_aeltestenrat_tresen:0 "Council of Elders at the Bar"
 WFL_aeltestenrat_tresen_desc:0 "Three veteran marksmen claim to have sat through far worse club crises, usually on these very bar stools. The Count appoints the bar as a mediation table. The elders can now reconcile one angry board member: first listen, then examine the bill together, finally start talking again. A promised vote is another matter entirely."
 WFL_board_elders_unlocked_tt:0 "Unlocks §YAsk the Elders to Mediate§!: for §Y50§! political power, calm one angry board member and raise general mood by §G10§! points. 30-day cooldown."
 WFL_board_aeltestenrat_vermitteln:0 "Ask the Elders to Mediate"
 WFL_board_aeltestenrat_vermitteln_desc:0 "The elders invite §Y[WFLBoardEldersTarget]§! to the bar. After a serious discussion of disappointed expectations and misallocated sausages, this member sets aside their anger for the next assembly.\n\n§Y50§! political power; §G+10§! general mood; calms exactly one angry member. 30-day cooldown. If several are angry, mediation follows portrait order. Used lobbying attempts remain spent, existing promises remain, and no new promise is granted."
