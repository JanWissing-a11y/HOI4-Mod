l_english:
 WFL_royal_recruitment_festivals:0 "Jan's Festivals Without Borders"
 WFL_royal_recruitment_festivals_desc:0 "Jan Graf von Insel I. welcomes voluntary recruits with music, hospitality and potato salad. Four one-time preparations each permanently add 5 percentage points to the accessible share of recruitable non-core manpower, for a maximum of +20 percentage points. Jan must rule, and WFL must own or control at least one non-core state. Losing these conditions cancels ongoing preparation without a bonus."
 WFL_koenigliche_freibieroffensive:0 "The Royal Free-Beer Offensive"
 WFL_koenigliche_freibieroffensive_desc:0 "Jan brings the taps and the brass band. A voluntary enlistment form waits at the recruiting table; signatures wait until the following morning. Once only: 50 political power and 30 days of preparation, then a permanent +5 percentage points of non-core manpower."
 WFL_kartoffelsalat_ohne_grenzen:0 "Potato Salad Without Borders"
 WFL_kartoffelsalat_ohne_grenzen_desc:0 "Anyone still pondering club membership after the royal festival is invited to an international potato-salad contest. Friendships grow, and so do voluntary applications. After the free-beer drive: 75 political power and 45 days of preparation for another permanent +5 percentage points of non-core manpower."
 WFL_blasmusik_statt_formulare:0 "Brass Bands Beat Bureaucracy"
 WFL_blasmusik_statt_formulare_desc:0 "The band plays, interpreters explain voluntary service, and Jan answers questions between encores. Even the paperwork has found its rhythm. After the potato-salad festival: 100 political power and 60 days of preparation for another permanent +5 percentage points of non-core manpower."
 WFL_der_grosse_schuetzenpass:0 "A Hangover for the Fatherland"
 WFL_der_grosse_schuetzenpass_desc:0 "The following morning Jan serves the biggest hangover breakfast on the Lower Rhine. Between pickled herring, coffee and impressively off-key singing, the guests found new marksmen's clubs. More and more sign up for the army on their way home: the next exercise ought to have equally good catering. After the brass-band round: once only, 125 political power and 90 days preparation for another permanent +5 percentage points of non-core manpower."
 WFL_freibierfreiwillige:0 "The Free-Beer Volunteers"
 WFL_freibierfreiwillige_desc:0 "The neighbours now know Jan personally, and voluntary service has a welcoming face. Adds 5 percentage points to the accessible share of recruitable manpower from non-core states."
 WFL_kartoffelsalat_kameraden:0 "The Potato-Salad Comrades"
 WFL_kartoffelsalat_kameraden_desc:0 "The recipe remains disputed, but the new friendships last. Adds 5 percentage points to the accessible share of recruitable non-core manpower; stacks with the other festival bonuses."
 WFL_blasmusik_bataillone:0 "The Brass-Band Battalions"
 WFL_blasmusik_bataillone_desc:0 "Shared songs and clear information persuade more volunteers. Adds 5 percentage points to the accessible share of recruitable non-core manpower; stacks with the other festival bonuses."
 WFL_schuetzenpass_freiwillige:0 "Volunteers with Marksman Passes"
 WFL_schuetzenpass_freiwillige_desc:0 "Friendly gatherings have built a dependable voluntary recruiting network. Adds 5 percentage points to the accessible share of recruitable non-core manpower; all four festival bonuses total +20 percentage points."
