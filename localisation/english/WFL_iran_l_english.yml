l_english:
 WFL_iran_erbfolgekrise:0 "Trouble at the Peacock Throne"
 WFL_iran_erbfolgekrise_desc:0 "A succession of thoroughly dubious accidents has thrown Iran's royal succession into confusion. The Count orders a study of the family trees: there appears to be room for a green-and-white ribbon among the mourning bands. This branch requires an independent, non-capitulated Wesel-Flüren."
 WFL_iran_gesandtschaft:0 "Höhne's Persian Mission"
 WFL_iran_gesandtschaft_desc:0 "Chief diplomat Lukas Höhne travels to Tehran with impeccable manners, a suitcase full of medals and very little knowledge of court protocol. His mission: meet Princess Shirin and connect the futures of the two courts."
 WFL_iran_hochzeit:0 "Love at First Toast"
 WFL_iran_hochzeit_desc:0 "Royal receptions, a misplaced marksmen's march and long conversations turn into romance. Princess Shirin and Lukas Höhne choose each other. A court lawyer must now explain why the Flüren club committee appears on the wedding invitations."
 WFL_iran_treuevertrag:0 "Al Höhne's Treaty of Loyalty"
 WFL_iran_treuevertrag_desc:0 "The palace's dusty succession rules reserve the crown for a man. Shirin therefore secures the throne for her future husband, Shah Al Höhne. He signs his loyalty to Flüren directly below the marriage certificate. A business trip becomes a dynasty, and a marriage vow becomes an unusually far-reaching treaty of friendship."
 WFL_iran_treuevertrag_tt:0 "§YIran§! immediately becomes a §Ypuppet of Wesel-Flüren§!. §YAl Höhne§! leads its neutral government with his new portrait. Any previous overlord is replaced. An annexed Iran is restored from its core states; Tehran provides the historical anchor if all Iranian cores were removed. No random roll or foreign consent is required. Field Marshal Lukas Höhne I. remains available."
 WFL_PER_al_hoehne:0 "Al Höhne"
 WFL_PER_al_hoehne_desc:0 "He arrived in Tehran as Lukas Höhne with diplomatic luggage. He leaves the wedding hall as Al Höhne, carrying a crown, a cigar and a treaty of loyalty to Flüren. His new Iranian ruler role preserves his devotion to the Count."
 WFL_PER_fluerentreuer_schah:0 "Shah Loyal to Flüren"
 WFL_PER_fluerentreuer_schah_desc:0 "Courtly charm and dependable ties to Flüren give Al Höhne +5% political power gain and +5 percentage points of stability."
 wfl_iran_succession.1.t:0 "A Crown in Search of a Head"
 wfl_iran_succession.1.d:0 "Black-bordered telegrams pile up in Tehran. One claimant died in an unexplained palace accident; another after a hunting trip whose report consists mainly of blacked-out pages. The court spokesman calls it an unfortunate chain of coincidences. Even the caretaker looks unconvinced.\n\nThe adult Princess Shirin keeps the court functioning while relatives anxiously recount their family trees. In Flüren, the Count takes a sip and studies the situation. 'A vacant succession? A job for our chief diplomat.' Lukas Höhne receives a suitcase and firm instructions to avoid signing any palace accident reports."
 wfl_iran_succession.1.a:0 "Höhne, you now handle both foreign and domestic affairs."
 wfl_iran_succession.2.t:0 "A Marksman at the Peacock Throne"
 wfl_iran_succession.2.d:0 "Lukas Höhne arrives with three suitcases: clothes, diplomatic gifts, and medals in case anyone asks about his qualifications. At the first reception he informs the master of ceremonies that a proper marksmen's march needs a vigorous opening. The orchestra obliges so enthusiastically that two court councillors accidentally stand to attention.\n\nPrincess Shirin laughs first. Politically astute, she finds the usual suitors about as appealing as the Count finds alcohol-free beer. Höhne listens to her instead of searching a family tree. Their walk in the palace gardens lasts well beyond the official reception. The protocol clerk writes: 'Relations developing exceptionally well. Presumably diplomatic relations too.'"
 wfl_iran_succession.2.a:0 "The embassy requests a second walk."
 wfl_iran_succession.3.t:0 "Two Hearts and a Very Long Treaty"
 wfl_iran_succession.3.d:0 "Walks become evenings of stories, and stories become romance. Shirin admits that she finds Höhne's impossibly overloaded medal case charming. He replies that her smile has bypassed all his diplomatic defences. Both freely choose to marry.\n\nOnly the palace's dusty succession rules cause trouble: the crumpled court lawyers insist that only a man may rule. Shirin reads the rule, puts it aside with a pointed sigh and secures the crown for her husband. 'You get the crown,' she says. 'We discuss government over breakfast.' Flüren sends congratulations and a treaty of loyalty whose Appendix A governs the proper storage of wedding drinks."
 wfl_iran_succession.3.a:0 "The Count covers the best man's allowance."
 wfl_iran_succession.4.t:0 "Long Live Al Höhne!"
 wfl_iran_succession.4.d:0 "The new Shah appears before the court with golden epaulettes, a cigar and the remarkably confident name Al Höhne. The crown is secure; so is the treaty with Wesel-Flüren. Under his signature he has written: 'Loyal to the Count, including outside opening hours.'\n\nThe court chancellor reads the new settlement: Iran will henceforth be a puppet state under the Count's protection. An indignant councillor asks whether that clause was in the engagement announcement. Shirin points to the footnote after 'forever united' and opens the wedding reception. Al Höhne raises his glass to his wife, his new homeland and his old club. The Count cables: 'Diplomatic success acknowledged. Please return all bottle deposits.' The protocol clerk crosses out 'return journey' on his expenses and writes 'occupancy of throne'."
 wfl_iran_succession.4.a:0 "To the Shah and his extraordinary business trip!"
