l_english:
 WFL_beraterstab_gruenden:0 "The Count's Marksmen Council"
 WFL_beraterstab_gruenden_desc:0 "The Count invites five capable minds to the civic hall. Unfortunately, the council table has only three comfortable chairs. Appointed members gain special powers and complete three successive assignments alongside our normal national focus. The council serves only Jan and the Marksmen Tradition."
 WFL_staff_shortcut:0 "Marksmen Council"
 WFL_staff_system_tt:0 "Three additional special seats chosen from five councillors. Appointments take 14 days, followed by a 175-day appointment cooldown. Each member automatically handles their own subsequent focuses: 75–120 days of preparation, then 140/140/280 days of work. Your normal focus continues. Removal ends office bonuses; achieved ranks and completed focuses remain."
 WFL_staff_leadership_tt:0 "Jan Graf von Insel I. rules uncapitulated Wesel-Flüren under the Marksmen Tradition."
 WFL_staff_cooldown_tt:0 "The appointment cooldown has expired. [?WFL_staff_cooldown|0] days remain."
 WFL_staff_pending_tt:0 "No council replacement is awaiting a response."
 WFL_staff_appointment_tt:0 "The councillor receives a vacant special seat. If all three are occupied, a replacement event lets us choose an existing member to dismiss. Their office bonuses end and their current assignment is discarded. Cancelling makes the appointment focus available again. Normal political advisor slots are not used."
 WFL_staff_upgrade_tt:0 "Automatic council assignment: improves office bonuses by one rank. The reward applies once, only to the member who still holds office after completing their work period."
 wfl_staff.1.t:0 "Five Candidates, Three Padded Chairs"
 wfl_staff.1.d:0 "The Count opens the Marksmen Council in the civic hall. Dante brings a roster, Neal a supply plan and his notorious measuring glass. Max Heinsch is already discussing another production line, Max Müller unfolds his maps, and Till has stamped every attendance slip in advance.\n\nOnly then does anyone notice that the table has just three padded chairs. The treasurer declares the other two strategic reserves. The Count rules that three councillors may hold special powers and work independently on their plans. Any newcomer must take over an existing chair if necessary."
 wfl_staff.1.a:0 "The padded chairs are a matter of state."
 wfl_staff.2.t:0 "The Council Table Is Getting Crowded"
 wfl_staff.2.desc:0 "Another councillor is ready, but all three special seats are occupied. The Count rejects a suggestion to put a garden chair in the middle: the treasurer might demand special powers next.\n\nChoose the member who will leave the council. Their office bonuses end and unfinished work is cancelled. Completed projects and the achieved office rank remain for a later reappointment. The nomination may also be withdrawn."
 wfl_staff.2.d:0 "Withdraw the nomination."
 wfl_staff.2.a:0 "Replace special seat 1."
 wfl_staff.2.b:0 "Replace special seat 2."
 wfl_staff.2.c:0 "Replace special seat 3."
 WFL_staff_dante_grossy_name:0 "Dante Grossy"
 WFL_staff_dante_grossy_desc:0 "Dante keeps lists on which even the medals line up by rank. When three companies simultaneously turned towards the buffet, he invented the orderly return march. Nobody has confused an enlistment form with a drinks voucher since."
 WFL_staff_appoint_dante_grossy:0 "Appoint Dante Grossy"
 WFL_staff_appoint_dante_grossy_desc:0 "Dante keeps lists on which even the medals line up by rank. When three companies simultaneously turned towards the buffet, he invented the orderly return march. Nobody has confused an enlistment form with a drinks voucher since.\n\nCouncil office: Marksmen Organiser. Once appointed, he independently completes three assignments alongside our normal focus."
 WFL_staff_dante_grossy_autonomous_tt:0 "Only Dante Grossy may complete this focus automatically while holding a special seat. Preparation: 75–120 days; assignments: 140/140/280 days. Time remaining on the current assignment: [?WFL_staff_dante_grossy_days|0] days. This does not occupy your national focus slot."
