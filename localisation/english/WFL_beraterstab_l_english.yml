 WFL_staff_neal_foerster_name:0 "Neal Foerster"
 WFL_staff_neal_foerster_desc:0 "Neal can turn five kitchen slips into a supply plan and coax a proper meal out of an apparently empty store. His famous water glass is strictly a measuring instrument; the Count has approved the exception in writing. Well-fed troops also stand a little straighter on parade."
