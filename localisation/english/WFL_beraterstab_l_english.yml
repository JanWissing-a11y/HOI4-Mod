 WFL_staff_till_hoehne_name:0 "Till Hoehne"
 WFL_staff_till_hoehne_desc:0 "Till arrived at the first cabinet meeting with a stamp, a construction plan and enough carbon copies for the entire Lower Rhine. Decisions now arrive before the coffee pot runs dry. Only requests for new forms still require a form; he refuses to abandon that tradition."
