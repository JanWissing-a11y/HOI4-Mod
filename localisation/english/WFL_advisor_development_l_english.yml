l_english:
 WFL_advisor_development:0 "Political Advisor Development"
 WFL_advisor_development_desc:0 "After completing the vocational college, eight currently hired political advisors can receive a one-time development upgrade for 100 political power each. The original trait is replaced; employment, portrait and occupied advisor slot remain unchanged. The source profiles retain their ideological effects and drawbacks."
 WFL_advisor_upgrade_01:0 "Experienced Security Coordination"
 WFL_advisor_upgrade_01_desc:0 "The complete numerical upgrade of the German source is retained: one operative slot, faster agency upgrades and the original occupation/intelligence modifiers."
 WFL_develop_advisor_01:0 "Richard Nachrichtenau: Experienced Security Coordination"
 WFL_develop_advisor_01_desc:0 "A one-time 100 political power development course after completing the vocational college. The matching WFL character must already be recruited and hired as a political advisor. Their existing trait is fully replaced by the upgrade; no additional advisor slot is created. Götterdämmerung is required. La Résistance and an existing intelligence agency are also required."
 WFL_advisor_upgrade_02:0 "Militant Association Organiser"
 WFL_advisor_upgrade_02_desc:0 "The original communist support, political and militia bonuses are retained unchanged. This profile replaces only the Götterdämmerung base variant."
 WFL_develop_advisor_02:0 "Jakob Rotacker: Militant Association Organiser"
 WFL_develop_advisor_02_desc:0 "A one-time 100 political power development course after completing the vocational college. The matching WFL character must already be recruited and hired as a political advisor. Their existing trait is fully replaced by the upgrade; no additional advisor slot is created. Götterdämmerung is required."
 WFL_advisor_upgrade_03:0 "Developed Collective Economy"
 WFL_advisor_upgrade_03_desc:0 "The original industrial output, resources and resource-shortage values are retained, with the upgrade's exact additional infrastructure and civilian factory construction bonuses."
 WFL_develop_advisor_03:0 "Alfred Gemeinschaft: Developed Collective Economy"
 WFL_develop_advisor_03_desc:0 "A one-time 100 political power development course after completing the vocational college. The matching WFL character must already be recruited and hired as a political advisor. Their existing trait is fully replaced by the upgrade; no additional advisor slot is created. Götterdämmerung is required."
 WFL_advisor_upgrade_04:0 "Determined State Planner"
 WFL_advisor_upgrade_04_desc:0 "All source values are retained, including communist support and the drawback of -5 percent production efficiency growth."
 WFL_develop_advisor_04:0 "Viktor Ordnau: Determined State Planner"
 WFL_develop_advisor_04_desc:0 "A one-time 100 political power development course after completing the vocational college. The matching WFL character must already be recruited and hired as a political advisor. Their existing trait is fully replaced by the upgrade; no additional advisor slot is created. Götterdämmerung is required."
 WFL_advisor_upgrade_05:0 "Comprehensive Reform Programme"
 WFL_advisor_upgrade_05_desc:0 "The exact production, political power and democratic support bonuses are retained, including -25 communist and fascist diplomatic acceptance. The original role condition disables the effects under a democratic government."
 WFL_develop_advisor_05:0 "Daniel Wiesenbrück: Comprehensive Reform Programme"
 WFL_develop_advisor_05_desc:0 "A one-time 100 political power development course after completing the vocational college. The matching WFL character must already be recruited and hired as a political advisor. Their existing trait is fully replaced by the upgrade; no additional advisor slot is created. Götterdämmerung is required. Only usable under a non-democratic government: the role's original do_effect condition remains in place."
 WFL_advisor_upgrade_06:0 "Expanded Intelligence Leadership"
 WFL_advisor_upgrade_06_desc:0 "The unchanged source upgrade grants two operative slots and the original agency, occupation and intelligence modifiers."
 WFL_develop_advisor_06:0 "Adrian Falkenried: Expanded Intelligence Leadership"
 WFL_develop_advisor_06_desc:0 "A one-time 100 political power development course after completing the vocational college. The matching WFL character must already be recruited and hired as a political advisor. Their existing trait is fully replaced by the upgrade; no additional advisor slot is created. Götterdämmerung is required. La Résistance and an existing intelligence agency are also required."
 WFL_advisor_upgrade_07:0 "Experienced Intelligence Deputy"
 WFL_advisor_upgrade_07_desc:0 "The unchanged source upgrade replaces the previous profile with an operative slot, intelligence agency defence and improved network growth."
 WFL_develop_advisor_07:0 "Leonhard Freihagen: Experienced Intelligence Deputy"
 WFL_develop_advisor_07_desc:0 "A one-time 100 political power development course after completing the vocational college. The matching WFL character must already be recruited and hired as a political advisor. Their existing trait is fully replaced by the upgrade; no additional advisor slot is created. Götterdämmerung is required. La Résistance and an existing intelligence agency are also required. Waking the Tiger remains required as in the base role."
 WFL_advisor_upgrade_08:0 "Expanded Overseas Administration"
 WFL_advisor_upgrade_08_desc:0 "Political power gain, non-core manpower, occupation effects and militia organisation exactly match the improved German source."
 WFL_develop_advisor_08:0 "August Fernbach: Expanded Overseas Administration"
 WFL_develop_advisor_08_desc:0 "A one-time 100 political power development course after completing the vocational college. The matching WFL character must already be recruited and hired as a political advisor. Their existing trait is fully replaced by the upgrade; no additional advisor slot is created. Götterdämmerung is required."
