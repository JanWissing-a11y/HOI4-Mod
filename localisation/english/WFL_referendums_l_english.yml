l_english:
 WFL_schuetzenreferenden:0 "The Genius of the Shooting Clubs"
 WFL_schuetzenreferenden_desc:0 "Our shooting-club festivals peacefully promote the community of Flüren. The one-time 90-day campaign costs 75 political power. Afterwards, up to two referendum requests cost 100 political power each; a second request requires refusal or cancellation of the first. At normal relations, AI owners permit 25% of requests, followed by a 60% Yes chance. Good relations and democratic owners improve the odds. Only a valid Yes transfers territory and grants a core. Costs are not refunded."
 WFL_schuetzenkampagne_51:0 "A Shooting-Club Festival in the Rhineland"
 WFL_schuetzenkampagne_51_desc:0 "For 75 political power, our Flüren clubs spend 90 days promoting their traditions and community in the Rhineland. This campaign is one-time. Once completed, it unlocks up to two paid referendum requests. Peace, sovereign participants and full owner control are required; costs are not refunded."
 WFL_referendum_beantragen_51:0 "Request a Referendum: the Rhineland"
 WFL_referendum_beantragen_51_desc:0 "After the campaign, spend 100 political power on the first peaceful accession request for the Rhineland. The AI base chance to permit it is 25%, followed by a 60% Yes chance; good relations improve both. The vote follows consent by 30 days. Only a valid Yes transfers the region and grants a WFL core. Refusal or cancellation permits one final request for another 100 political power. Each unresolved request expires after 120 days; costs remain spent."
 wfl_referendum.1.t:0 "The Clubs of Flüren Appeal to the Rhineland"
 wfl_referendum.1.d:0 "Having held their shooting-club festivals in the Rhineland, the visitors from Flüren request a peaceful accession referendum. We may permit the process or refuse without losing territory. Consent alone transfers nothing: a separate vote follows 30 days later, and we must explicitly recognize a Yes result."
 wfl_referendum.1.a:0 "Permit a free vote."
 wfl_referendum.1.b:0 "Refuse the procedure."
 wfl_referendum.2.t:0 "The Accession Referendum in the Rhineland"
 wfl_referendum.2.d:0 "After the shooting-club campaign, the Rhineland must decide whether to join Flüren. Recognizing a Yes transfers the region and grants WFL a core. A No leaves the region with us. Transfer requires the same owner, full control, peace and sovereign participants."
 wfl_referendum.2.a:0 "The majority says Yes. Recognize accession."
 wfl_referendum.2.b:0 "The result is No. Retain the region."
 wfl_referendum.2.c:0 "The conditions no longer hold. Cancel the procedure."
 wfl_referendum.3.t:0 "the Rhineland Joins Flüren"
 wfl_referendum.3.d:0 "The clubs of Flüren have won support for their community. A permitted referendum returned a recognized Yes. the Rhineland now belongs to Flüren and is a WFL core. Other countries retain their existing cores."
 wfl_referendum.3.a:0 "To our new community!"
 wfl_referendum.4.t:0 "No Accession for the Rhineland"
 wfl_referendum.4.d:0 "The procedure for the Rhineland ended without accession: the owner refused the request or the vote returned No. No territory or WFL core is granted. A first failed request permits a second for another 100 political power. After the second, the opportunity is exhausted. All previous costs remain spent."
 wfl_referendum.4.a:0 "Respect their decision."
 wfl_referendum.5.t:0 "The Procedure for the Rhineland Has Ended"
 wfl_referendum.5.d:0 "The conditions for our campaign or referendum for the Rhineland no longer hold, or a request remained unresolved for 120 days. No territory or WFL core is granted. If the campaign was completed, the first failed request leaves a second for another 100 political power; after the second, no attempts remain. Costs are not refunded."
 wfl_referendum.5.a:0 "No accession without valid consent."
 wfl_referendum.7.t:0 "The Club Campaign in the Rhineland Is Complete"
 wfl_referendum.7.d:0 "After 90 days promoting the genius of our clubs, a first referendum request for the Rhineland is available for 100 political power. Refusal or cancellation allows a second and final request for another 100, without repeating the campaign. The owner must fully control the region, and both countries must remain peaceful and sovereign."
 wfl_referendum.7.a:0 "We can submit the request."
