l_english:
 WFL_brauereiverbund_idee:0 "Flüren Brewery Association"
 WFL_brauereiverbund_idee_desc:0 "Shared workshops, bottles and delivery schedules increase civilian factory construction speed by 10 percent. The treasurer now treats bottle deposits as a unit of measurement."
 WFL_festlogistik_idee:0 "Festival Tent Logistics"
 WFL_festlogistik_idee_desc:0 "Anyone who can move a brass band, potato salad and a hundred folding chairs can organize military supplies. Supply consumption is reduced by 8 percent."
 WFL_vereinsdiplomatie_idee:0 "Diplomacy with an Honour Ribbon"
 WFL_vereinsdiplomatie_idee_desc:0 "Good relations begin with an invitation and occasionally last until the final march. The ongoing cost of improving diplomatic relations is reduced by 15 percent."
 WFL_schuetzenakademie_idee:0 "Flüren Marksmen's Academy"
 WFL_schuetzenakademie_idee_desc:0 "Shared training and clear commands increase army organization by 5 percent. The order to form ranks explicitly applies to the buffet queue."
 WFL_rheinischer_forschungsbund_idee:0 "Rhenish Research Association"
 WFL_rheinischer_forschungsbund_idee_desc:0 "The vocational college and laboratories share their findings. General research speed increases by 5 percent. Technical terms must still fit on a beer mat."
 WFL_festkasse_idee:0 "The Incorruptible Festival Fund"
 WFL_festkasse_idee_desc:0 "A permanent festival fund provides reliable planning: +0.05 daily political power and +2 percentage points stability. Only the missing deposit token remains a state secret."
 WFL_vereinsnachwuchs_idee:0 "Recruits from the Shooting Range"
 WFL_vereinsnachwuchs_idee_desc:0 "The Marksmen's Olympics establish permanent training clubs. Recruitable population +0.5 percentage points; army training time -5 percent."
 WFL_vereinsverstaendigung_idee:0 "Understanding beneath Marksmen's Hats"
 WFL_vereinsverstaendigung_idee_desc:0 "The world congress promotes peaceful exchange: stability +10 percentage points, war support -5 percentage points. Disputes are first discussed at the cake buffet."
 WFL_weltweiter_vereinsnachwuchs_idee:0 "A Club on Every Continent"
 WFL_weltweiter_vereinsnachwuchs_idee_desc:0 "International clubs inspire new volunteers: recruitable population +1 percentage point and non-core manpower +5 percentage points."
 WFL_community_industrieforschung:0 "Auesee Inventors' Fair"
 wfl_community.1.t:0 "The Largest Beer Mat in State History"
 wfl_community.1.d:0 "To celebrate the brewery association, Jan Graf von Insel I. orders a banquet table. The carpenter misunderstands the measurements and delivers a beer mat that seats twelve people. The treasurer discovers enough space for the entire annual budget.\n\nWhile the band plays the welcome march for a third time, two committees dispute the surplus. Should it finance an immediate public festival or establish a permanent festival fund? Jan rejects a third proposal to spend everything on a golden bottle opener. That would be difficult to explain to the budget committee.\n\nIf Jan no longer rules when the decision is made, the plans are wound down and either option grants 50 political power instead."
 wfl_community.1.a:0 "Let all of Flüren celebrate!"
 wfl_community.1.b:0 "Put a lock on the festival fund."
 wfl_community.2.t:0 "The First Flüren Marksmen's Olympics"
 wfl_community.2.d:0 "Jan opens the Marksmen's Olympics with a speech about endurance, precision and the inviolable queue at the grill. Events include target shooting, an obstacle course and carrying a folding chair into a headwind. The royal guard reports serious tactical difficulties with the last event.\n\nBy evening, more medals hang from the reviewing stand than from the competitors. The training staff wants to analyze the lessons immediately. The clubs would rather turn the grounds into a permanent training centre for new volunteers. The folding chair receives its own locker.\n\nIf Jan has since left office, the sporting results are archived and the chosen option grants 50 political power instead."
 wfl_community.2.a:0 "Keep the chair as a training aid."
 wfl_community.2.b:0 "Make room for the next generation!"
 wfl_community.4.t:0 "Laboratory Open Day: Please Do Not Knock on the Reactor"
 wfl_community.4.d:0 "The researchers at Auesee hold an inventors' fair. One team presents an automatic bottle-return machine; another unveils a potato peeler with far too many switches. A cordoned-off door carries a sign: Research in progress. Please do not test whether it glows.\n\nA teacher explains the machinery so clearly that the treasurer voluntarily copies down an equation. We can now concentrate the workshops on an industrial research project or organize a public exhibition to build wider support. Either way, the laboratory door remains open. The other door stays firmly shut."
 wfl_community.4.a:0 "Keep the workshops inventing."
 wfl_community.4.b:0 "Science for everyone!"
 wfl_community.5.t:0 "The World Congress of Marksmen's Clubs"
 wfl_community.5.d:0 "Delegations from around the world arrive in Flüren. The translation office immediately struggles with Deputy Royal Chain Bearer. Jan simplifies the title to the man with the other chain. The opening ceremony proceeds surprisingly smoothly.\n\nAfter three days, two resolutions remain. The first makes shared festivals, exchanges and peaceful understanding the clubs' primary purpose. The second establishes an international network of volunteer training clubs. Both demand a closing photograph. Negotiations about the number of flags continue late into the night.\n\nIf Jan leaves office before the resolution, the congress ends with a neutral report. The chosen option then grants 50 political power instead."
 wfl_community.5.a:0 "Understanding begins at the cake buffet."
 wfl_community.5.b:0 "A club on every continent!"
