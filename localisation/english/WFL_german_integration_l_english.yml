l_english:
 WFL_deutsche_einigung:0 "One Marksmen's Hat for All Germany"
 WFL_deutsche_einigung_desc:0 "Germany's starting territory on 1 January 1936 is sufficient for unification under the marksmen's hat. Other territorial claims remain intact. The special small-homeland bonus is replaced by the new core population."
 WFL_deutschland_unter_schuetzenhut_vereinen:0 "Unite Germany under the Marksmen's Hat"
 WFL_deutschland_unter_schuetzenhut_vereinen_desc:0 "Once we own and fully control Germany's starting territory on 1 January 1936, including Wesel-Flüren, those states gain our cores for free. Other current German core states also gain our cores if owned and fully controlled by us. Danzig, Memel, Gdynia, Poznan and Katowice are not required: we gain claims on foreign-held states in those regions and other German core states. Existing claims remain intact. The national spirit A Nation under the Marksmen's Hat and its +20 percentage points of recruitable population are removed. One successful use; occupation without ownership or partial control of the required states is insufficient."
